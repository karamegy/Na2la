<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>سوق الحمولات - أسطورة الطريق 3D PRO OPTIMIZED</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    
    <!-- مكتبات Firebase الإصدار 10 الحديث متوافقة مع التعديلات الجديدة -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, collection, getDocs, addDoc, deleteDoc, updateDoc, doc, onSnapshot, query, where, getDoc, setDoc, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDn-rNJ2ak3I0DdfzTZmXKJePDdgxhfyIY",
            authDomain: "n2la-642d3.firebaseapp.com",
            projectId: "n2la-642d3",
            storageBucket: "n2la-642d3.firebasestorage.app",
            messagingSenderId: "1085749997466",
            appId: "1:1085749997466:web:13e5535dc6d2312397d423"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.db = db;
        window.firebaseModules = { collection, getDocs, addDoc, deleteDoc, updateDoc, doc, onSnapshot, query, where, getDoc, setDoc, limit };

        signInAnonymously(auth).then(() => {
            window.dispatchEvent(new Event('firebase-ready'));
        }).catch(() => {
            window.dispatchEvent(new Event('firebase-ready'));
        });
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #2563eb; --accent: #2563eb; --bg: #f1f5f9;
            --card-bg: #ffffff; --text-color: #1e293b; --success: #10b981;
            --border-color: #cbd5e1;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); padding: 12px; padding-top: calc(12px + env(safe-area-inset-top, 0px)); padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); color: var(--text-color); direction: rtl; }
        
        header { 
            background: var(--card-bg); padding: 14px; border-radius: 16px; margin-bottom: 15px;
            display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color); flex-wrap: wrap; gap: 10px;
        }

        .search-bar {
            width: 100%; padding: 14px; border-radius: 12px; border: 2px solid var(--border-color);
            margin-bottom: 15px; font-size: 13px; background: white; outline: none; color: var(--text-color);
        }
        .search-bar:focus { border-color: var(--primary); }

        .cargo-item {
            background: var(--card-bg); border-radius: 16px; padding: 16px;
            margin-bottom: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-right: 5px solid var(--accent); border: 1px solid var(--border-color);
        }
        .cargo-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .cargo-route { font-weight: 800; color: #334155; font-size: 13px; }
        .price-tag { background: #dbeafe; color: var(--primary); padding: 4px 10px; border-radius: 8px; font-weight: bold; font-size: 12px; }
        
        .cargo-actions-row {
            display: flex; gap: 8px; margin-top: 10px;
        }
        .whatsapp-btn {
            flex: 2; padding: 11px; background: #25D366; color: white; border: none; cursor: pointer;
            text-align: center; border-radius: 10px; text-decoration: none; font-weight: bold; font-size: 12px;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .call-btn {
            flex: 1; padding: 11px; background: #2563eb; color: white; border: none; cursor: pointer;
            text-align: center; border-radius: 10px; text-decoration: none; font-weight: bold; font-size: 12px;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .share-btn {
            padding: 11px 14px; background: #475569; color: white; border: none; cursor: pointer;
            text-align: center; border-radius: 10px; font-weight: bold; font-size: 12px;
            display: flex; align-items: center; justify-content: center;
        }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; background-color: var(--card-bg); border-top: 1px solid var(--border-color);
            display: flex; justify-content: space-around; align-items: center; padding: 8px 4px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); z-index: 1000; box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
        }
        .bottom-nav-item {
            text-decoration: none; color: #94a3b8; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 3px;
            cursor: pointer; background: none; border: none; font-weight: bold;
        }
        .bottom-nav-item span.icon { font-size: 1.2rem; }
        .bottom-nav-item.active, .bottom-nav-item:hover { color: var(--primary); }

        .btn-nav { background: #475569; color: #fff; text-decoration: none; padding: 6px 14px; border-radius: 6px; font-size: 0.85rem; display: inline-block; font-weight: bold; cursor: pointer; border: none; }
    </style>
</head>
<body>

    <header>
        <div style="display:flex; align-items:center; gap:8px;">
            <h2 style="color: var(--primary); font-size: 15px;">🚚 سوق الحمولات المباشر</h2>
        </div>
        <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
            <button type="button" onclick="navigateToPage('index.html')" class="btn-nav">🏠 الرئيسية</button>
            <button type="button" onclick="navigateToPage('operations-hub.html')" class="btn-nav" style="background: #2563eb;">🚀 العمليات</button>
            <span id="company-badge-display" style="font-size: 11px; background: #e2e8f0; padding: 4px 10px; border-radius: 6px; font-weight: bold; color:#1e293b;">الشركة: جاري التحميل...</span>
        </div>
    </header>

    <!-- حقل البحث -->
    <input type="text" id="searchBar" class="search-bar" placeholder="🔍 ابحث هنا (مثال: القاهرة، ملابس، 500)..." oninput="filterCargoList()">

    <!-- قائمة الحمولات -->
    <div id="cargoList">جاري تحميل الحمولات المعزولة...</div>

    <!-- شريط التنقل السفلي الموحد -->
    <nav class="bottom-nav">
        <button class="bottom-nav-item" onclick="navigateToPage('index.html')">
            <span class="icon">🏠</span>
            <span>الرئيسية</span>
        </button>
        <button class="bottom-nav-item active" onclick="navigateToPage('cargo.html')">
            <span class="icon">📦</span>
            <span>الحمولات</span>
        </button>
        <button class="bottom-nav-item" onclick="navigateToPage('operations-hub.html')">
            <span class="icon">🚀</span>
            <span>العمليات</span>
        </button>
        <button class="bottom-nav-item" onclick="navigateToPage('driver-community.html')">
            <span class="icon">💬</span>
            <span>المجتمع</span>
        </button>
    </nav>

    <!-- ربط Capacitor Native -->
    <script src="capacitor.js"></script>

    <script>
        // ==========================================
        // 1. استقبال بيانات الجلسة الموحدة من الصفحة الرئيسية
        // ==========================================
        const urlParams = new URLSearchParams(window.location.search);
        const savedSession = JSON.parse(localStorage.getItem('na2la_active_session') || '{}');

        const activeUserId = (urlParams.get('userId') || urlParams.get('id') || urlParams.get('phone') || urlParams.get('driver') || urlParams.get('name') || savedSession.userId || localStorage.getItem('logged_in_driver_name') || '').trim();
        const activeCompanyId = (urlParams.get('companyId') || urlParams.get('company') || savedSession.companyId || localStorage.getItem('current_company_id') || 'company_main').trim();
        const activeUserRole = (urlParams.get('role') || savedSession.role || localStorage.getItem('current_user_role') || 'driver').trim();

        // ==========================================
        // 2. الجسر البرمجي الكامل لـ Capacitor Native
        // ==========================================
        const CapacitorNative = {
            isNative: () => typeof window.Capacitor !== 'undefined' && window.Capacitor.isNativePlatform(),

            async init() {
                if (!this.isNative()) return;
                const { App, StatusBar, SplashScreen } = window.Capacitor.Plugins;

                if (StatusBar) {
                    try {
                        await StatusBar.setBackgroundColor({ color: '#2563eb' });
                        await StatusBar.setStyle({ style: 'DARK' });
                    } catch (e) {}
                }

                if (SplashScreen) {
                    try { await SplashScreen.hide(); } catch (e) {}
                }

                if (App) {
                    App.addListener('backButton', ({ canGoBack }) => {
                        if (canGoBack) {
                            window.history.back();
                        } else {
                            navigateToPage('index.html');
                        }
                    });
                }
            },

            async vibrate(style = 'LIGHT') {
                if (this.isNative() && window.Capacitor.Plugins.Haptics) {
                    try {
                        await window.Capacitor.Plugins.Haptics.impact({ style });
                        return;
                    } catch (e) {}
                }
                if ('vibrate' in navigator) navigator.vibrate(60);
            },

            async shareCargo(title, text) {
                await this.vibrate('MEDIUM');
                if (this.isNative() && window.Capacitor.Plugins.Share) {
                    try {
                        await window.Capacitor.Plugins.Share.share({
                            title: title,
                            text: text,
                            url: 'https://karamegy.github.io/Na2la/cargo.html',
                            dialogTitle: 'مشاركة تفاصيل الحمولة'
                        });
                        return;
                    } catch (e) {}
                }
                if (navigator.share) {
                    try {
                        await navigator.share({ title, text });
                        return;
                    } catch (e) {}
                }
                if (navigator.clipboard) {
                    await navigator.clipboard.writeText(text);
                    alert('📋 تم نسخ تفاصيل الحمولة إلى الحافظة!');
                }
            }
        };

        let currentDriverProfile = {
            name: activeUserId || 'زائر',
            role: activeUserRole || 'driver',
            badge: '',
            id: activeUserId || ''
        };
        let currentCompanyId = activeCompanyId || 'company_main';
        let allCargoData = [];

        window._activeUnsubscribers = [];

        window.addEventListener('beforeunload', () => {
            window._activeUnsubscribers.forEach(unsub => {
                if (typeof unsub === 'function') unsub();
            });
        });

        async function initCargoApp() {
            await CapacitorNative.init();
            if (window.db && window.firebaseModules) {
                await fetchCloudSession();
            } else {
                window.addEventListener('firebase-ready', async () => {
                    await fetchCloudSession();
                }, { once: true });
            }
        }

        async function fetchCloudSession() {
            if (!window.db || !window.firebaseModules) return;
            const { collection, getDocs, query, limit } = window.firebaseModules;

            let externalId = activeUserId;
            let urlComp = activeCompanyId;

            if (urlComp && urlComp !== 'null' && urlComp !== '') {
                currentCompanyId = urlComp;
            }

            try {
                const qDrivers = query(collection(window.db, 'drivers'), limit(50));
                const snapshot = await getDocs(qDrivers);
                let found = null;
                snapshot.forEach(docSnap => {
                    let d = docSnap.data();
                    let docId = String(docSnap.id || '').trim().toLowerCase();
                    let dName = String(d.name || '').trim().toLowerCase();
                    let dPhone = String(d.phone || '').trim();

                    if (externalId) {
                        let target = externalId.toLowerCase();
                        if (docId === target || dName === target || dPhone === target || dName.includes(target)) {
                            found = { id: docSnap.id, ...d };
                        }
                    }
                });

                if (found) {
                    if (found.companyId && String(found.companyId).trim() !== '') {
                        currentCompanyId = String(found.companyId).trim();
                    }
                    currentDriverProfile = {
                        id: found.id,
                        name: found.name || 'سائق معتمد',
                        role: found.role || found.rank || activeUserRole || 'driver',
                        badge: found.badge || ''
                    };
                } else if (externalId) {
                    currentDriverProfile = {
                        id: externalId,
                        name: externalId,
                        role: isUserAdmin(activeUserRole, externalId) ? 'admin' : activeUserRole,
                        badge: ''
                    };
                }
            } catch (e) {}

            localStorage.setItem('na2la_active_session', JSON.stringify({
                userId: currentDriverProfile.name,
                companyId: currentCompanyId,
                role: currentDriverProfile.role,
                timestamp: Date.now()
            }));

            document.getElementById('company-badge-display').innerText = `🏢 الشراكة: ${currentCompanyId}`;
            setupCargoRealtimeSync();
        }

        window.navigateToPage = function(pageName) {
            CapacitorNative.vibrate('LIGHT');
            const queryParams = `?userId=${encodeURIComponent(currentDriverProfile.name)}&companyId=${encodeURIComponent(currentCompanyId)}&role=${encodeURIComponent(currentDriverProfile.role)}`;
            window.location.href = pageName + queryParams;
        };

        function isUserAdmin(roleValue, nameValue) {
            let role = String(roleValue || currentDriverProfile.role || '').toLowerCase().trim();
            let name = String(nameValue || currentDriverProfile.name || '').toLowerCase().trim();
            let badge = String(currentDriverProfile.badge || '').toLowerCase().trim();
            const adminGuesses = ['admin', 'super_admin', 'مدير', 'مدير نظام', 'مشرف', 'مدير عام', 'المدير', 'مدير شركة'];
            return adminGuesses.includes(role) || adminGuesses.includes(name) || badge === 'admin' || name.includes('المدير') || name.includes('كرم');
        }

        function setupCargoRealtimeSync() {
            if (!window.db || !window.firebaseModules) return;
            const { collection, onSnapshot, query, limit } = window.firebaseModules;

            const qCargo = query(collection(window.db, "cargo"), limit(100));
            let unsubCargo = onSnapshot(qCargo, (snapshot) => {
                if (document.activeElement && document.activeElement.id === 'searchBar') {
                    return;
                }

                allCargoData = [];
                snapshot.docs.forEach(docSnap => {
                    let c = docSnap.data();
                    let cComp = (c.companyId || "").trim();
                    let isSuper = isUserAdmin();

                    if (isSuper || !cComp || cComp === currentCompanyId) {
                        allCargoData.push({ id: docSnap.id, ...c });
                    }
                });

                allCargoData.sort((a, b) => Number(b.timestamp || 0) - Number(a.timestamp || 0));
                filterCargoList();
            });

            window._activeUnsubscribers.push(unsubCargo);
        }

        window.filterCargoList = function() {
            const queryVal = document.getElementById('searchBar').value.toLowerCase().trim();
            const filtered = allCargoData.filter(c => 
                (c.from && c.from.toLowerCase().includes(queryVal)) || 
                (c.to && c.to.toLowerCase().includes(queryVal)) ||
                (c.type && c.type.toLowerCase().includes(queryVal)) ||
                (c.item && c.item.toLowerCase().includes(queryVal))
            );
            renderUI(filtered);
        };

        window.shareCargoItem = function(from, to, type, price, phone) {
            const msg = `🚚 حمولة متاحة عبر أسطورة الطريق:\n📍 المسار: من ${from || 'غير محدد'} إلى ${to || 'غير محدد'}\n📦 النوع: ${type || 'عام'}\n💰 النولون: ${price || 0} ج.م\n📞 للتواصل: ${phone || 'غير مسجل'}`;
            CapacitorNative.shareCargo('حمولة متاحة - أسطورة الطريق', msg);
        };

        function renderUI(data) {
            const container = document.getElementById('cargoList');
            if (!container) return;
            if (data.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:20px; color:#64748b;">لا توجد حمولات تطابق بحثك لشراكتك ❌</div>`;
                return;
            }
            container.innerHTML = data.map(c => {
                const cleanPhone = String(c.phone || '').replace(/[^0-9]/g, '');
                const waPhone = cleanPhone.startsWith('0') ? '2' + cleanPhone : (cleanPhone.startsWith('20') ? cleanPhone : '20' + cleanPhone);
                return `
                <div class="cargo-item">
                    <div class="cargo-header">
                        <span class="cargo-route">📍 ${c.from || 'غير محدد'} ➔ ${c.to || 'غير محدد'}</span>
                        <span class="price-tag">${c.price || 0} ج.م</span>
                    </div>
                    <div style="font-size: 12px; color: #64748b; margin-bottom: 10px;">
                        <div>📦 النوع / الحمولة: <b>${c.type || c.item || 'عام'}</b></div>
                        <div>⏰ الموعد / التاريخ: ${c.time || c.date || 'اليوم'}</div>
                        ${c.companyId ? `<div>🏢 الشركة: <b>${c.companyId}</b></div>` : ''}
                    </div>
                    <div class="cargo-actions-row">
                        <a href="https://wa.me/${waPhone}" onclick="CapacitorNative.vibrate('MEDIUM')" class="whatsapp-btn"><i class="fa-brands fa-whatsapp"></i> واتساب</a>
                        <a href="tel:${c.phone || ''}" onclick="CapacitorNative.vibrate('MEDIUM')" class="call-btn"><i class="fa-solid fa-phone"></i> اتصال</a>
                        <button type="button" onclick="shareCargoItem('${(c.from||'').replace(/'/g, '')}', '${(c.to||'').replace(/'/g, '')}', '${(c.type||c.item||'عام').replace(/'/g, '')}', '${c.price||0}', '${c.phone||''}')" class="share-btn" title="مشاركة الحمولة"><i class="fa-solid fa-share-nodes"></i></button>
                    </div>
                </div>
            `}).join('');
        }

        window.addEventListener('DOMContentLoaded', initCargoApp);
    </script>
</body>
</html>
