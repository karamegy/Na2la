<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق الحمولات - أسطورة الطريق 3D PRO</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    
    <!-- مكتبات Firebase الإصدار 8 المستقر (متطابقة مع index.html لضمان التوافق التام) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    
    <style>
        :root {
            --primary: linear-gradient(135deg, #1e293b, #0f172a);
            --accent: #2563eb;
            --accent-gradient: linear-gradient(135deg, #3b82f6, #1d4ed8);
            --success: #10b981;
            --success-gradient: linear-gradient(135deg, #34d399, #059669);
            --danger: #ef4444;
            --danger-gradient: linear-gradient(135deg, #f87171, #dc2626);
            --bg: #f1f5f9;
            --card-bg: linear-gradient(145deg, #ffffff, #f8fafc);
            --text-color: #1e293b;
            --border-color: #cbd5e1;
            --shadow-3d: 0 15px 35px -5px rgba(37, 99, 235, 0.2), 0 8px 15px -6px rgba(37, 99, 235, 0.1);
        }

        body.dark-mode {
            --bg: #070913;
            --card-bg: linear-gradient(145deg, #10172a, #0b0f19);
            --text-color: #f8fafc;
            --border-color: #1e293b;
            --shadow-3d: 0 15px 35px -5px rgba(0, 0, 0, 0.6), 0 8px 15px -6px rgba(0, 0, 0, 0.4);
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: var(--text-color); padding: 12px; padding-bottom: 100px; direction: rtl; transition: background 0.3s, color 0.3s; }
        
        .app-3d-logo-container { text-align: center; margin: 8px 0 14px 0; }
        .logo-3d {
            display: inline-block; 
            background: linear-gradient(135deg, #2563eb, #1e293b, #3b82f6);
            color: #ffffff; padding: 10px 22px; border-radius: 16px; font-size: 15px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 1.5px;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .logo-3d span { color: #38bdf8; }

        header { 
            background: var(--card-bg); color: var(--text-color); padding: 14px; border-radius: 16px; margin-bottom: 14px;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
            box-shadow: var(--shadow-3d); border: 1px solid var(--border-color);
        }

        .header-profile-section { display: flex; align-items: center; gap: 12px; }

        .header-avatar-3d {
            width: 50px; height: 50px; border-radius: 50%; object-fit: cover;
            border: 3px solid #3b82f6; background: var(--accent-gradient);
            display: flex; justify-content: center; align-items: center;
            font-weight: bold; color: white; font-size: 18px;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.4);
            cursor: pointer; transition: transform 0.2s;
        }
        .header-avatar-3d:hover { transform: scale(1.08); }

        .card { 
            background: var(--card-bg); padding: 18px; border-radius: 16px; 
            box-shadow: var(--shadow-3d); margin-bottom: 14px; border: 1px solid var(--border-color); 
            position: relative; overflow: hidden;
        }
        .card::after {
            content: ""; position: absolute; top: 0; right: 0; width: 100%; height: 3px;
            background: var(--accent-gradient); opacity: 0.9;
        }
        .card h3 { margin-bottom: 12px; font-size: 14px; border-bottom: 2px solid var(--border-color); padding-bottom: 8px; color: var(--accent); }

        input, textarea, select, button { width: 100%; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 12px; background: var(--bg); color: var(--text-color); margin-bottom: 8px; outline: none; }
        
        .btn-success { background: var(--success-gradient); color: white; border: none; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
        .btn-sm { padding: 6px 12px; font-size: 11px; width: auto; display: inline-block; border-radius: 8px; cursor: pointer; font-weight: bold; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        @media(max-width: 500px) { .grid-2 { grid-template-columns: 1fr; } }

        .cargo-item {
            background: var(--card-bg); border: 1px solid var(--border-color); border-right: 5px solid var(--accent);
            border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }
        .cargo-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .cargo-route { font-size: 12px; font-weight: bold; color: var(--accent); }
        .cargo-badge { background: #e0e7ff; color: var(--accent); padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; }
        .cargo-details { font-size: 11px; color: var(--text-color); line-height: 1.5; margin-bottom: 10px; opacity: 0.9; }
        .whatsapp-btn { background-color: #25D366; color: white; text-decoration: none; padding: 8px 12px; border-radius: 8px; font-size: 11px; font-weight: bold; display: inline-block; text-align: center; }

        /* شريط التنقل السفلي المتطابق */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background-color: var(--card-bg); border-top: 1px solid var(--border-color);
            display: flex; justify-content: space-around; align-items: center;
            padding: 8px 4px; z-index: 1000; box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
        }
        .bottom-nav-item {
            text-decoration: none; color: #94a3b8; font-size: 10px;
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            cursor: pointer; background: none; border: none; font-weight: bold;
            transition: color 0.2s;
        }
        .bottom-nav-item span.icon { font-size: 1.2rem; }
        .bottom-nav-item.active, .bottom-nav-item:hover { color: var(--accent); }

        .custom-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 10000; justify-content: center; align-items: center; padding: 15px; }
    </style>
</head>
<body>

    <div class="app-3d-logo-container">
        <div class="logo-3d">أسطورة الطريق <span>CARGO HUB</span></div>
    </div>

    <!-- الهيدر -->
    <header>
        <div class="header-profile-section">
            <div id="header-avatar-container" class="header-avatar-3d" onclick="openProfileModal()" title="انقر لعرض تفاصيل حسابك">جاري</div>
            <div>
                <h2 style="font-size: 13px; cursor: pointer;" onclick="openProfileModal()" id="header-username-title">سوق الحمولات</h2>
                <small style="opacity: 0.85; font-size: 10px;" id="logged-user-label">جاري المزامنة...</small>
            </div>
        </div>
        <div style="display: flex; gap: 6px; align-items: center;">
            <span id="cloudStatusIndicator" style="font-size:9px; background:#10b981; color:#fff; padding:4px 8px; border-radius:6px; font-weight:bold;">☁️ متصل</span>
            <button type="button" onclick="toggleDarkMode()" class="btn-sm" style="background:#475569; color:#fff;">🌙/☀️</button>
        </div>
    </header>

    <!-- نموذج إضافة حمولة جديدة -->
    <div class="card" style="border: 2px solid var(--success);">
        <h3 style="color: var(--success);">📦 إضافة طلب نقل حمولة جديد (مزامنة سحابية)</h3>
        <form id="cargoForm" onsubmit="addCargoCloud(event)">
            <div class="grid-2">
                <input type="text" id="fromLoc" placeholder="من (مكان التحميل): طنطا" required>
                <input type="text" id="toLoc" placeholder="إلى (مكان التفريغ): القاهرة" required>
            </div>
            <div class="grid-2">
                <input type="text" id="cargoType" placeholder="نوع البضاعة: ملابس / أدوات" required>
                <input type="number" id="offeredPrice" placeholder="السعر المقترح (ج.م): 600" required>
            </div>
            <div class="grid-2">
                <input type="tel" id="clientPhone" placeholder="رقم الواتساب: 010XXXXXXXX" required>
                <input type="text" id="loadTime" placeholder="موعد التحميل: اليوم 5 مساءً" required>
            </div>
            <button type="submit" class="btn-success" style="padding: 10px; margin-top: 4px;">🚀 نشر طلب الحمولة للسائقين سحابياً</button>
        </form>
    </div>

    <!-- قائمة الحمولات المتاحة -->
    <div class="card" style="border: 2px solid var(--accent);">
        <h3 style="color: var(--accent);">🚛 الحمولات والطلبات المتاحة حالياً (متزامن سحابياً)</h3>
        <div id="cargoList">جاري جلب الحمولات من السحابة...</div>
    </div>

    <!-- نافذة منبثقة للبروفايل -->
    <div id="profileModal" class="custom-modal" onclick="closeProfileModal()">
        <div class="card" style="width: 100%; max-width: 380px; margin: auto; position: relative;" onclick="event.stopPropagation()">
            <h3 style="color: var(--accent);">👤 تفاصيل حسابك المسجل</h3>
            <div id="profileModalBody" style="font-size: 12px; line-height: 1.6;">جاري التحميل...</div>
            <button type="button" class="btn-success" onclick="closeProfileModal()" style="margin-top: 12px; width: 100%;">إغلاق النافذة</button>
        </div>
    </div>

    <!-- شريط التنقل السفلي الموحد -->
    <nav class="bottom-nav">
        <button class="bottom-nav-item" onclick="location.href='index.html'">
            <span class="icon">☰</span>
            <span>القائمة</span>
        </button>
        <button class="bottom-nav-item" onclick="location.href='safe.html'">
            <span class="icon">💰</span>
            <span>الخزنة</span>
        </button>
        <button class="bottom-nav-item" onclick="location.href='index.html'">
            <span class="icon">💬</span>
            <span>الدردشة</span>
        </button>
        <button class="bottom-nav-item active" onclick="location.href='cargo.html'">
            <span class="icon">📦</span>
            <span>الشحنات</span>
        </button>
        <button class="bottom-nav-item" onclick="openProfileModal()">
            <span class="icon">👤</span>
            <span>البروفايل</span>
        </button>
    </nav>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDn-rNJ2ak3I0DdfzTZmXKjePDdgxhfyIY",
            authDomain: "n2la-642d3.firebaseapp.com",
            projectId: "n2la-642d3",
            storageBucket: "n2la-642d3.firebasestorage.app",
            messagingSenderId: "1085749997466",
            appId: "1:1085749997466:web:13e5535dc6d2312397d423"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // قراءة اسم السائق من ذاكرة المتصفح لضمان المزامنة التامة مع index.html
        let currentDriverProfile = {
            name: localStorage.getItem('logged_in_driver_name') || 'المدير',
            avatar: '',
            title: 'أسطورة الطريق',
            phone: ''
        };

        let myShipmentsCount = 0;

        async function initCargoPage() {
            try {
                const snapshot = await db.collection('drivers').get();
                snapshot.forEach(doc => {
                    let d = doc.data();
                    if (d.name === currentDriverProfile.name) {
                        if (d.avatar) currentDriverProfile.avatar = d.avatar;
                        if (d.title || d.role) currentDriverProfile.title = d.title || d.role;
                        if (d.phone) currentDriverProfile.phone = d.phone;
                    }
                });
            } catch (e) { console.error(e); }

            // حساب عدد الشحنات الخاصة بالسائق من مجموعة shipments
            db.collection('shipments').onSnapshot(snapshot => {
                let count = 0;
                snapshot.forEach(doc => {
                    let data = doc.data();
                    if (data.assignedDriver === currentDriverProfile.name || data.driver === currentDriverProfile.name || data.name === currentDriverProfile.name) {
                        count++;
                    }
                });
                myShipmentsCount = count;
            });

            document.getElementById('logged-user-label').innerText = `${currentDriverProfile.name} | ${currentDriverProfile.title}`;
            
            const avatarContainer = document.getElementById('header-avatar-container');
            if (currentDriverProfile.avatar) {
                avatarContainer.innerHTML = `<img src="${currentDriverProfile.avatar}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;
            } else {
                avatarContainer.innerText = currentDriverProfile.name.charAt(0);
            }

            loadCloudCargo();
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('dark_mode', document.body.classList.contains('dark-mode'));
        }
        if (localStorage.getItem('dark_mode') === 'true') document.body.classList.add('dark-mode');

        function openProfileModal() {
            const modal = document.getElementById('profileModal');
            const body = document.getElementById('profileModalBody');
            
            body.innerHTML = `
                <div style="text-align: center; margin-bottom: 12px;">
                    <div style="width: 65px; height: 65px; border-radius: 50%; background: var(--accent); color: white; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; margin: 0 auto 8px auto; overflow: hidden; border: 2px solid #fff;">
                        ${currentDriverProfile.avatar ? `<img src="${currentDriverProfile.avatar}" style="width:100%; height:100%; object-fit:cover;">` : currentDriverProfile.name.charAt(0)}
                    </div>
                    <strong style="font-size: 14px; display: block;">${currentDriverProfile.name}</strong>
                    <span style="font-size: 10px; opacity: 0.8; color: var(--accent);">${currentDriverProfile.title}</span>
                </div>
                
                <div style="border-top: 1px solid var(--border-color); padding-top: 8px; margin-top: 8px;">
                    <p style="margin-bottom: 6px;"><strong>رقم الهاتف:</strong> ${currentDriverProfile.phone || 'غير متوفر'}</p>
                    <p style="margin-bottom: 6px;"><strong>إجمالي الشحنات المسجلة:</strong> <span style="color:var(--success); font-weight:bold;">${myShipmentsCount}</span> شحنة</p>
                    <p style="margin-bottom: 6px;"><strong>حالة الاتصال:</strong> <span style="color: var(--success);">🟢 متاح للعمل</span></p>
                </div>
            `;
            modal.style.display = 'flex';
        }

        function closeProfileModal() {
            document.getElementById('profileModal').style.display = 'none';
        }

        // إضافة حمولة جديدة سحابياً
        window.addCargoCloud = async function(e) {
            e.preventDefault();

            const fromLoc = document.getElementById('fromLoc').value.trim();
            const toLoc = document.getElementById('toLoc').value.trim();
            const cargoType = document.getElementById('cargoType').value.trim();
            const offeredPrice = document.getElementById('offeredPrice').value.trim();
            const clientPhone = document.getElementById('clientPhone').value.trim();
            const loadTime = document.getElementById('loadTime').value.trim();

            const cargoId = String(Date.now());
            const cargoObj = {
                id: cargoId,
                from: fromLoc,
                to: toLoc,
                type: cargoType,
                price: offeredPrice,
                phone: clientPhone,
                time: loadTime,
                date: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }),
                timestamp: Date.now()
            };

            try {
                // حفظ في مجموعة cargo و shipments
                await db.collection("cargo").doc(cargoId).set(cargoObj);
                await db.collection("shipments").doc(cargoId).set({
                    id: cargoId,
                    name: currentDriverProfile.name,
                    assignedDriver: currentDriverProfile.name,
                    clientPhone: clientPhone,
                    item: `نقل حمولة من ${fromLoc} إلى ${toLoc} (${cargoType})`,
                    price: Number(offeredPrice),
                    date: new Date().toLocaleDateString('ar-EG'),
                    status: 'نشطة',
                    type: 'shipment'
                });

                document.getElementById('cargoForm').reset();
                alert("✅ تم نشر طلب الحمولة بنجاح ومزامنته سحابياً!");
            } catch (err) {
                alert("⚠️ خطأ أثناء حفظ الحمولة سحابياً: " + err.message);
            }
        };

        // تحميل الحمولات من سحابة Firestore لحظياً
        function loadCloudCargo() {
            const container = document.getElementById('cargoList');
            db.collection("cargo").onSnapshot((snapshot) => {
                let cloudList = [];
                snapshot.forEach(doc => {
                    cloudList.push(doc.data());
                });

                cloudList.sort((a, b) => b.timestamp - a.timestamp);

                if (cloudList.length === 0) {
                    container.innerHTML = `<div style="text-align:center; color:#94a3b8; font-size:11px; padding:15px;">لا توجد طلبات حمولات معروضة حالياً.</div>`;
                    return;
                }

                container.innerHTML = cloudList.map(c => {
                    const waMessage = encodeURIComponent(`السلام عليكم، قرأت طلب الحمولة الخاص بك على تطبيق أسطورة الطريق (من ${c.from} إلى ${c.to}). أنا جاهز لنقل الحمولة.`);
                    const waUrl = `https://wa.me/2${c.phone}?text=${waMessage}`;

                    return `
                        <div class="cargo-item">
                            <div class="cargo-header">
                                <span class="cargo-route">📍 ${c.from} ⬅️ ${c.to}</span>
                                <span class="cargo-badge">${c.price} ج.م</span>
                            </div>
                            <div class="cargo-details">
                                <strong>نوع الحمولة:</strong> ${c.type}<br>
                                <strong>موعد التحميل:</strong> ${c.time}<br>
                                <small style="opacity:0.7;">تم النشر: ${c.date || 'الآن'}</small>
                            </div>
                            <a href="${waUrl}" target="_blank" class="whatsapp-btn">💬 تواصل مع العميل عبر WhatsApp</a>
                        </div>
                    `;
                }).join('');
            }, (error) => {
                console.error("خطأ في جلب الحمولات سحابياً:", error);
            });
        }

        window.onload = initCargoPage;
    </script>
</body>
</html>
