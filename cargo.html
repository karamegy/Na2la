<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق الحمولات - أسطورة الطريق 3D PRO</title>
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    
    <style>
        :root {
            --primary: #2563eb; --accent: #2563eb; --bg: #f1f5f9;
            --card-bg: #ffffff; --text-color: #1e293b; --success: #10b981;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg); padding: 12px; padding-bottom: 100px; }
        
        /* تحسينات التصميم */
        .search-bar {
            width: 100%; padding: 14px; border-radius: 12px; border: 2px solid #cbd5e1;
            margin-bottom: 15px; font-size: 14px; background: white; outline: none;
        }
        .search-bar:focus { border-color: var(--primary); }

        .cargo-item {
            background: var(--card-bg); border-radius: 16px; padding: 16px;
            margin-bottom: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-right: 5px solid var(--accent); transition: transform 0.2s;
        }
        .cargo-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .cargo-route { font-weight: 800; color: #334155; }
        .price-tag { background: #dbeafe; color: var(--primary); padding: 4px 10px; border-radius: 8px; font-weight: bold; font-size: 12px; }
        .whatsapp-btn {
            display: block; width: 100%; padding: 12px; background: #25D366; color: white;
            text-align: center; border-radius: 10px; text-decoration: none; font-weight: bold; margin-top: 10px;
        }
    </style>
</head>
<body>

    <header style="text-align:center; margin-bottom:20px;">
        <h2 style="color: var(--primary);">🚚 سوق الحمولات المباشر</h2>
    </header>

    <!-- حقل البحث الجديد -->
    <input type="text" id="searchBar" class="search-bar" placeholder="🔍 ابحث هنا (مثال: القاهرة، ملابس، 500)..." oninput="filterCargoList()">

    <!-- قائمة الحمولات -->
    <div id="cargoList">جاري تحميل الحمولات...</div>

    <!-- شريط التنقل السفلي (كما في السابق) -->
    <nav class="bottom-nav">
        <button class="bottom-nav-item" onclick="location.href='index.html'"><span>☰</span></button>
        <button class="bottom-nav-item" onclick="location.href='cargo.html'"><span>📦</span></button>
    </nav>

    <script>
        const firebaseConfig = { /* (ضع نفس الكونفيج الخاص بك هنا) */ };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let allCargoData = []; // تخزين مؤقت للبيانات للبحث

        // دالة الفلترة
        function filterCargoList() {
            const query = document.getElementById('searchBar').value.toLowerCase();
            const filtered = allCargoData.filter(c => 
                c.from.toLowerCase().includes(query) || 
                c.to.toLowerCase().includes(query) ||
                c.type.toLowerCase().includes(query)
            );
            renderUI(filtered);
        }

        // دالة العرض
        function renderUI(data) {
            const container = document.getElementById('cargoList');
            if (data.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:20px;">لا توجد حمولات تطابق بحثك ❌</div>`;
                return;
            }
            container.innerHTML = data.map(c => `
                <div class="cargo-item">
                    <div class="cargo-header">
                        <span class="cargo-route">📍 ${c.from} ➔ ${c.to}</span>
                        <span class="price-tag">${c.price} ج.م</span>
                    </div>
                    <div style="font-size: 12px; color: #64748b; margin-bottom: 10px;">
                        <div>📦 النوع: <b>${c.type}</b></div>
                        <div>⏰ الموعد: ${c.time}</div>
                    </div>
                    <a href="https://wa.me/2${c.phone}" class="whatsapp-btn">💬 تواصل عبر الواتساب</a>
                </div>
            `).join('');
        }

        // جلب البيانات لحظياً
        db.collection("cargo").onSnapshot(snapshot => {
            allCargoData = snapshot.docs.map(doc => doc.data());
            allCargoData.sort((a, b) => b.timestamp - a.timestamp);
            renderUI(allCargoData);
        });
    </script>
</body>
</html>
