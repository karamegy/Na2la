<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق الحمولات - أسطورة الطريق 3D PRO OPTIMIZED</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    
    <!-- مكتبات Firebase الإصدار 10 الحديث متوافقة مع التعديلات الجديدة -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, collection, getDocs, addDoc, deleteDoc, updateDoc, doc, onSnapshot, query, where, getDoc, setDoc, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDn-rNJ2ak3I0DdfzTZmXKJePDdgxhfyIY",
            authDomain: "n2la-642d3.firebaseapp.com",
            projectId: "n2la-642d3",
            storageBucket: "n2la-642d3.firebasestorage.app",
            messagingSenderId: "1085749997466",
            appId: "1:1085749997466:web:13e5535dc6d2312397d423"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.db = db;
        window.firebaseModules = { collection, getDocs, addDoc, deleteDoc, updateDoc, doc, onSnapshot, query, where, getDoc, setDoc, limit };

        signInAnonymously(auth).then(() => {
            console.log("✅ تم المصادقة سحابياً بنجاح في cargo.html");
            window.dispatchEvent(new Event('firebase-ready'));
        }).catch((error) => {
            console.error("⚠️ خطأ في المصادقة السحابية:", error);
            window.dispatchEvent(new Event('firebase-ready'));
        });
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #2563eb; --accent: #2563eb; --bg: #f1f5f9;
            --card-bg: #ffffff; --text-color: #1e293b; --success: #10b981;
            --border-color: #cbd5e1;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg); padding: 12px; padding-bottom: 110px; color: var(--text-color); direction: rtl; }
        
        header { 
            background: var(--card-bg); padding: 14px; border-radius: 16px; margin-bottom: 15px;
            display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color); flex-wrap: wrap; gap: 10px;
        }

        .search-bar {
            width: 100%; padding: 14px; border-radius: 12px; border: 2px solid var(--border-color);
            margin-bottom: 15px; font-size: 13px; background: white; outline: none; color: var(--text-color);
        }
        .search-bar:focus { border-color: var(--primary); }

        .cargo-item {
            background: var(--card-bg); border-radius: 16px; padding: 16px;
            margin-bottom: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-right: 5px solid var(--accent); border: 1px solid var(--border-color);
        }
        .cargo-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .cargo-route { font-weight: 800; color: #334155; font-size: 13px; }
        .price-tag { background: #dbeafe; color: var(--primary); padding: 4px 10px; border-radius: 8px; font-weight: bold; font-size: 12px; }
        .whatsapp-btn {
            display: block; width: 100%; padding: 12px; background: #25D366; color: white;
            text-align: center; border-radius: 10px; text-decoration: none; font-weight: bold; margin-top: 10px; font-size: 12px;
        }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; background-color: var(--card-bg); border-top: 1px solid var(--border-color);
            display: flex; justify-content: space-around; align-items: center; padding: 8px 4px; z-index: 1000; box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
        }
        .bottom-nav-item {
            text-decoration: none; color: #94a3b8; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 3px;
            cursor: pointer; background: none; border: none; font-weight: bold;
        }
        .bottom-nav-item span.icon { font-size: 1.2rem; }
        .bottom-nav-item.active, .bottom-nav-item:hover { color: var(--primary); }

        .btn-nav { background: #475569; color: #fff; text-decoration: none; padding: 6px 14px; border-radius: 6px; font-size: 0.85rem; display: inline-block; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div style="display:flex; align-items:center; gap:8px;">
            <h2 style="color: var(--primary); font-size: 15px;">🚚 سوق الحمولات المباشر</h2>
        </div>
        <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
            <a onclick="navigateToPage('index.html')" class="btn-nav">🏠 الرئيسية</a>
            <a onclick="navigateToPage('operations-hub.html')" class="btn-nav" style="background: #2563eb;">🚀 العمليات</a>
            <span id="company-badge-display" style="font-size: 11px; background: #e2e8f0; padding: 4px 10px; border-radius: 6px; font-weight: bold; color:#1e293b;">الشركة: جاري التحميل...</span>
        </div>
    </header>

    <!-- حقل البحث -->
    <input type="text" id="searchBar" class="search-bar" placeholder="🔍 ابحث هنا (مثال: القاهرة، ملابس، 500)..." oninput="filterCargoList()">

    <!-- قائمة الحمولات -->
    <div id="cargoList">جاري تحميل الحمولات المعزولة...</div>

    <!-- شريط التنقل السفلي الموحد -->
    <nav class="bottom-nav">
        <button class="bottom-nav-item" onclick="navigateToPage('index.html')">
            <span class="icon">🏠</span>
            <span>الرئيسية</span>
        </button>
        <button class="bottom-nav-item active" onclick="navigateToPage('cargo.html')">
            <span class="icon">📦</span>
            <span>الحمولات</span>
        </button>
        <button class="bottom-nav-item" onclick="navigateToPage('operations-hub.html')">
            <span class="icon">🚀</span>
            <span>العمليات</span>
        </button>
        <button class="bottom-nav-item" onclick="navigateToPage('driver-community.html')">
            <span class="icon">💬</span>
            <span>المجتمع</span>
        </button>
    </nav>

    <script>
        let currentDriverProfile = {
            name: 'زائر',
            role: 'driver',
            badge: '',
            id: ''
        };
        let currentCompanyId = 'company_main';
        let allCargoData = [];

        // مصفوفة لتخزين وتفريغ دوال الـ Unsubscribe لمنع تراكم الاتصالات والقراءات
        window._activeUnsubscribers = [];

        window.addEventListener('beforeunload', () => {
            window._activeUnsubscribers.forEach(unsub => {
                if (typeof unsub === 'function') unsub();
            });
        });

        async function initCargoApp() {
            if (window.db && window.firebaseModules) {
                await fetchCloudSession();
            } else {
                window.addEventListener('firebase-ready', async () => {
                    await fetchCloudSession();
                }, { once: true });
            }
        }

        async function fetchCloudSession() {
            if (!window.db || !window.firebaseModules) return;
            const { collection, getDocs, query, limit } = window.firebaseModules;

            const urlParams = new URLSearchParams(window.location.search);
            let externalId = (urlParams.get('userId') || urlParams.get('id') || urlParams.get('phone') || urlParams.get('driver') || urlParams.get('name') || '').trim();
            let urlComp = (urlParams.get('companyId') || urlParams.get('company') || '').trim();

            if (urlComp && urlComp !== 'null' && urlComp !== '') {
                currentCompanyId = urlComp;
            }

            try {
                // استخدام limit(50) لتخفيض حجم القراءات المدفوعة في حال البحث المبدئي
                const qDrivers = query(collection(window.db, 'drivers'), limit(50));
                const snapshot = await getDocs(qDrivers);
                let found = null;
                snapshot.forEach(docSnap => {
                    let d = docSnap.data();
                    let docId = String(docSnap.id || '').trim().toLowerCase();
                    let dName = String(d.name || '').trim().toLowerCase();
                    let dPhone = String(d.phone || '').trim();

                    if (externalId) {
                        let target = externalId.toLowerCase();
                        if (docId === target || dName === target || dPhone === target || dName.includes(target)) {
                            found = { id: docSnap.id, ...d };
                        }
                    }
                });

                if (found) {
                    if (found.companyId && String(found.companyId).trim() !== '') {
                        currentCompanyId = String(found.companyId).trim();
                    }
                    currentDriverProfile = {
                        id: found.id,
                        name: found.name || 'سائق معتمد',
                        role: found.role || found.rank || 'driver',
                        badge: found.badge || ''
                    };
                } else if (externalId) {
                    currentDriverProfile = {
                        id: externalId,
                        name: externalId,
                        role: isUserAdmin('', externalId) ? 'admin' : 'driver',
                        badge: ''
                    };
                }
            } catch (e) {}

            document.getElementById('company-badge-display').innerText = `🏢 الشراكة: ${currentCompanyId}`;
            setupCargoRealtimeSync();
        }

        window.navigateToPage = function(pageName) {
            const queryParams = `?userId=${encodeURIComponent(currentDriverProfile.name)}&companyId=${encodeURIComponent(currentCompanyId)}`;
            window.location.href = pageName + queryParams;
        };

        function isUserAdmin(roleValue, nameValue) {
            let role = String(roleValue || currentDriverProfile.role || '').toLowerCase().trim();
            let name = String(nameValue || currentDriverProfile.name || '').toLowerCase().trim();
            let badge = String(currentDriverProfile.badge || '').toLowerCase().trim();
            const adminGuesses = ['admin', 'مدير', 'مدير نظام', 'مشرف', 'مدير عام', 'المدير', 'مدير شركة'];
            return adminGuesses.includes(role) || adminGuesses.includes(name) || badge === 'admin' || name.includes('المدير') || name.includes('كرم');
        }

        function setupCargoRealtimeSync() {
            if (!window.db || !window.firebaseModules) return;
            const { collection, onSnapshot, query, limit } = window.firebaseModules;

            // استخدام limit(100) لمنع قراءة عدد هائل من المستندات الدفعة الواحدة وتخزين الـ Unsubscribe
            const qCargo = query(collection(window.db, "cargo"), limit(100));
            let unsubCargo = onSnapshot(qCargo, (snapshot) => {
                if (document.activeElement && document.activeElement.id === 'searchBar') {
                    return;
                }

                allCargoData = [];
                snapshot.docs.forEach(docSnap => {
                    let c = docSnap.data();
                    let cComp = (c.companyId || "").trim();
                    let isSuper = isUserAdmin();

                    if (isSuper || !cComp || cComp === currentCompanyId) {
                        allCargoData.push({ id: docSnap.id, ...c });
                    }
                });

                allCargoData.sort((a, b) => Number(b.timestamp || 0) - Number(a.timestamp || 0));
                filterCargoList();
            });

            window._activeUnsubscribers.push(unsubCargo);
        }

        window.filterCargoList = function() {
            const queryVal = document.getElementById('searchBar').value.toLowerCase().trim();
            const filtered = allCargoData.filter(c => 
                (c.from && c.from.toLowerCase().includes(queryVal)) || 
                (c.to && c.to.toLowerCase().includes(queryVal)) ||
                (c.type && c.type.toLowerCase().includes(queryVal)) ||
                (c.item && c.item.toLowerCase().includes(queryVal))
            );
            renderUI(filtered);
        };

        function renderUI(data) {
            const container = document.getElementById('cargoList');
            if (!container) return;
            if (data.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:20px; color:#64748b;">لا توجد حمولات تطابق بحثك لشراكتك ❌</div>`;
                return;
            }
            container.innerHTML = data.map(c => `
                <div class="cargo-item">
                    <div class="cargo-header">
                        <span class="cargo-route">📍 ${c.from || 'غير محدد'} ➔ ${c.to || 'غير محدد'}</span>
                        <span class="price-tag">${c.price || 0} ج.م</span>
                    </div>
                    <div style="font-size: 12px; color: #64748b; margin-bottom: 10px;">
                        <div>📦 النوع / الحمولة: <b>${c.type || c.item || 'عام'}</b></div>
                        <div>⏰ الموعد / التاريخ: ${c.time || c.date || 'اليوم'}</div>
                        ${c.companyId ? `<div>🏢 الشركة: <b>${c.companyId}</b></div>` : ''}
                    </div>
                    <a href="https://wa.me/2${c.phone || ''}" class="whatsapp-btn">💬 تواصل عبر الواتساب</a>
                </div>
            `).join('');
        }

        window.addEventListener('DOMContentLoaded', initCargoApp);
    </script>
</body>
</html>
