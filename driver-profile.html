<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حساب السائق - نقلة (Na2la)</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --accent-green: #22c55e;
            --border-color: #e2e8f0;
            --accent-orange: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 50px;
        }

        /* شريط التصفح */
        nav {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--primary-color);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 12px;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-color);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .nav-links a.active {
            color: var(--primary-color);
            font-weight: bold;
        }

        /* زر حرف العرض أو صورة الحساب في شريط التنقل العلوي */
        .nav-profile-link {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #dbeafe;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            border: 2px solid var(--primary-color);
            background-size: cover;
            background-position: center;
            overflow: hidden;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* البروفايل والصور */
        .profile-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        .cover-photo {
            height: 150px;
            background: linear-gradient(135deg, #2563eb, #1e40af);
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .change-cover-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .profile-details {
            padding: 0 20px 20px 20px;
            text-align: center;
            position: relative;
        }

        .avatar-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            margin: -50px auto 10px auto;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: #dbeafe;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            border: 4px solid var(--card-bg);
            background-size: cover;
            background-position: center;
        }

        .upload-avatar-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--primary-color);
            color: white;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.75rem;
            border: 2px solid white;
        }

        /* العناوين والأقسام */
        .section-title {
            font-size: 1.1rem;
            margin: 20px 0 10px 0;
            color: #334155;
            border-right: 4px solid var(--primary-color);
            padding-right: 8px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        /* أدوات التفاعل والإنتاجية */
        .btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            text-align: center;
            display: block;
            text-decoration: none;
            font-size: 0.95rem;
        }

        /* زر الموقع المباشر بتصميم ثلاثي الأبعاد (3D) متطور وصغير */
        .btn-3d-location {
            background: linear-gradient(145deg, #22c55e, #16a34a);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 6px 0 #15803d, 0 8px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.15s ease;
            transform: translateY(0);
        }

        .btn-3d-location:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #15803d, 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .post-item {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- شريط التصفح -->
    <nav>
        <a href="index.html" class="logo">نقلة Na2la</a>
        <ul class="nav-links">
            <li><a href="index.html">الرئيسية</a></li>
            <li><a href="community.html">المجتمع</a></li>
            <li><a href="driver-profile.html" class="active">حسابي</a></li>
            <li>
                <!-- صورة الحساب أو حرف العرض في شريط التنقل العلوي -->
                <a href="driver-profile.html" id="navProfileIcon" class="nav-profile-link" title="حسابي">ع</a>
            </li>
        </ul>
    </nav>

    <div class="container">

        <!-- 1. البروفايل والصور الشخصية (بيانات الحساب المتصل) -->
        <div class="profile-card" style="margin-top: 15px;">
            <div class="cover-photo" id="coverPhoto">
                <label class="change-cover-btn" for="coverInput">📷 تغيير الغلاف</label>
                <input type="file" id="coverInput" accept="image/*" style="display:none" onchange="uploadCover(event)">
            </div>
            
            <div class="profile-details">
                <div class="avatar-wrapper">
                    <div class="avatar" id="avatarDisplay">🚛</div>
                    <label class="upload-avatar-btn" for="avatarInput">📷</label>
                    <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="uploadAvatar(event)">
                </div>

                <h2 id="driverNameDisplay">عماد (سائق ربع نقل)</h2>
                <p id="driverBioDisplay" style="color: #64748b; font-size: 0.85rem; margin-top:4px;">سيارة ربع نقل - تجهيز حبال وصندوق</p>
            </div>
        </div>

        <!-- 2. ميزة التتبع الجغرافي واللوكيشن المباشر -->
        <h2 class="section-title">📍 التتبع والموقع المباشر</h2>
        <div class="card" style="text-align: center;">
            <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 12px;">شارك موقعك المباشر مع العملاء على الخريطة لتسهيل الوصول والتسليم:</p>
            <button class="btn-3d-location" onclick="shareLiveLocation()">
                <span>📡</span> تحديث ومشاركة موقعي
            </button>
            <div id="locationResult" style="margin-top: 10px; font-size: 0.85rem;"></div>
        </div>

        <!-- 3. نشر بوستات التحديثات للمجتمع ومنشوراتي السابقة -->
        <h2 class="section-title">📝 نشر منشور في مجتمع السائقين</h2>
        <div class="card">
            <textarea id="postText" style="width:100%; height:70px; padding:10px; border:1px solid #cbd5e1; border-radius:6px; resize:none;" placeholder="اكتب تحديثاً جديداً للعملاء والسائقين..."></textarea>
            <div style="margin-top:10px; display:flex; justify-content:space-between; align-items:center;">
                <input type="file" id="postImageInput" accept="image/*">
                <button class="btn" style="width: auto; padding: 8px 20px;" onclick="publishPost()">نشر الآن</button>
            </div>
        </div>

        <h2 class="section-title">منشوراتي السابقة</h2>
        <div id="driverPostsStream"></div>

    </div>

    <script>
        // بيانات الحساب الافتراضية والمتصل حالياً
        const defaultDriver = {
            name: "عماد (سائق ربع نقل)",
            bio: "سيارة ربع نقل - تجهيز حبال وصندوق",
            avatar: "",
            cover: ""
        };

        // استرجاع أو تهيئة بيانات السائق الحالي من قاعدة البيانات المحلية
        function getActiveDriver() {
            let driver = JSON.parse(localStorage.getItem('na2la_active_driver'));
            if (!driver) {
                driver = defaultDriver;
                localStorage.setItem('na2la_active_driver', JSON.stringify(driver));
            }
            return driver;
        }

        // تحديث أيقونة الحساب في الشريط العلوي
        function updateNavProfileIcon(avatarData, driverName) {
            const navIcon = document.getElementById('navProfileIcon');
            const firstLetter = driverName ? driverName.charAt(0) : 'ع';
            if (avatarData) {
                navIcon.style.backgroundImage = `url('${avatarData}')`;
                navIcon.innerText = '';
            } else {
                navIcon.style.backgroundImage = 'none';
                navIcon.innerText = firstLetter;
            }
        }

        // تطبيق بيانات السائق على واجهة الصفحة
        function loadDriverProfileToUI() {
            const driver = getActiveDriver();
            
            document.getElementById('driverNameDisplay').innerText = driver.name;
            document.getElementById('driverBioDisplay').innerText = driver.bio;

            const avatarDiv = document.getElementById('avatarDisplay');
            if (driver.avatar) {
                avatarDiv.style.backgroundImage = `url('${driver.avatar}')`;
                avatarDiv.innerText = '';
            } else {
                avatarDiv.style.backgroundImage = 'none';
                avatarDiv.innerText = '🚛';
            }

            if (driver.cover) {
                document.getElementById('coverPhoto').style.backgroundImage = `url('${driver.cover}')`;
            }

            updateNavProfileIcon(driver.avatar, driver.name);
        }

        // 1. رفع وتخزين صورة البروفايل للحساب المتصل
        function uploadAvatar(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const avatarData = evt.target.result;
                    let driver = getActiveDriver();
                    driver.avatar = avatarData;
                    localStorage.setItem('na2la_active_driver', JSON.stringify(driver));
                    loadDriverProfileToUI();
                };
                reader.readAsDataURL(file);
            }
        }

        // 2. رفع وتخزين صورة الغلاف للحساب المتصل
        function uploadCover(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const coverData = evt.target.result;
                    let driver = getActiveDriver();
                    driver.cover = coverData;
                    localStorage.setItem('na2la_active_driver', JSON.stringify(driver));
                    loadDriverProfileToUI();
                };
                reader.readAsDataURL(file);
            }
        }

        // 3. تتبع GPS والموقع المباشر
        function shareLiveLocation() {
            const resultDiv = document.getElementById('locationResult');
            if (navigator.geolocation) {
                resultDiv.innerHTML = "جاري تحديد موقعك...";
                navigator.geolocation.getCurrentPosition(function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const mapUrl = `https://www.google.com/maps?q=${lat},${lon}`;
                    resultDiv.innerHTML = `
                        <p style="color:green; font-weight:bold;">✔ تم تحديد الموقع بنجاح!</p>
                        <a href="${mapUrl}" target="_blank" style="color:#2563eb; font-weight:bold; text-decoration:underline;">رابط موقعك المباشر على Google Maps</a>
                    `;
                }, function(error) {
                    resultDiv.innerHTML = "<span style='color:red;'>تعذر الحصول على الموقع. يرجى تفعيل الـ GPS في هاتفك.</span>";
                });
            } else {
                resultDiv.innerHTML = "متصفحك لا يدعم تتبع الموقع.";
            }
        }

        // 4. حفظ البوستات ونشرها باسم السائق المتصل حالياً
        function publishPost() {
            const text = document.getElementById('postText').value.trim();
            const fileInput = document.getElementById('postImageInput');
            
            if (!text && fileInput.files.length === 0) {
                alert("يرجى كتابة نص أو إرفاق صورة");
                return;
            }

            if (fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    saveToCommunity(text, e.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                saveToCommunity(text, "");
            }
        }

        function saveToCommunity(text, imgData) {
            const driver = getActiveDriver();
            const newPost = {
                id: Date.now(),
                author: driver.name,
                text: text,
                image: imgData,
                time: "الآن"
            };

            let posts = JSON.parse(localStorage.getItem('na2la_community_posts')) || [];
            posts.unshift(newPost);
            localStorage.setItem('na2la_community_posts', JSON.stringify(posts));

            document.getElementById('postText').value = "";
            document.getElementById('postImageInput').value = "";
            renderPosts();
        }

        function renderPosts() {
            const container = document.getElementById('driverPostsStream');
            const driver = getActiveDriver();
            let posts = JSON.parse(localStorage.getItem('na2la_community_posts')) || [];
            let myPosts = posts.filter(p => p.author === driver.name);

            if (myPosts.length === 0) {
                container.innerHTML = "<p style='color:#94a3b8; font-size:0.85rem; margin-bottom:15px;'>لا توجد منشورات حالياً.</p>";
                return;
            }

            container.innerHTML = myPosts.map(p => `
                <div class="post-item">
                    <strong style="font-size:0.9rem;">${p.author}</strong>
                    <p style="font-size:0.85rem; margin-top:5px; white-space: pre-line;">${p.text}</p>
                    ${p.image ? `<img src="${p.image}" style="width:100%; max-height:200px; object-fit:cover; border-radius:6px; margin-top:8px;">` : ''}
                </div>
            `).join('');
        }

        // 5. تحميل البيانات عند فتح الصفحة
        window.onload = function() {
            loadDriverProfileToUI();
            renderPosts();
        };
    </script>

</body>
</html>
