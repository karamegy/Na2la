<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أسطورة الطريق - Global Transport Hub V60 PRO</title>
    <!-- خطوط جوجل العربية وتصميم الأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #1e3c72;
            --secondary: #2a5298;
            --accent: #ff9800;
            --success: #2e7d32;
            --danger: #c62828;
            --dark: #121212;
            --light: #f8f9fa;
            --radius: 12px;
            --shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #f0f2f5;
            color: #333;
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 15px 20px;
            text-align: center;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        header p {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .container {
            max-width: 100%;
            padding: 15px;
        }

        .card {
            background: white;
            border-radius: var(--radius);
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: var(--shadow);
        }

        .card h2 {
            font-size: 1.2rem;
            color: var(--primary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            border-color: var(--secondary);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(42,82,152,0.3);
            transition: opacity 0.3s;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn-accent {
            background: linear-gradient(135deg, #ff9800, #f57c00);
            box-shadow: 0 4px 10px rgba(255,152,0,0.3);
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.85rem;
        }

        table th, table td {
            padding: 10px 8px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        table th {
            background-color: var(--primary);
            color: white;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-success { background: #e8f5e9; color: var(--success); }
        .badge-danger { background: #ffebee; color: var(--danger); }

        .nav-tabs {
            display: flex;
            background: white;
            padding: 8px;
            gap: 5px;
            overflow-x: auto;
            position: sticky;
            top: 65px;
            z-index: 999;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .tab-btn {
            flex: 1;
            min-width: 90px;
            padding: 8px 10px;
            background: #f1f3f5;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #555;
            cursor: pointer;
            white-space: nowrap;
            text-align: center;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .community-post {
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .community-post h4 {
            font-size: 0.95rem;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .community-post p {
            font-size: 0.85rem;
            color: #555;
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-truck-fast"></i> أسطورة الطريق</h1>
        <p>Global Transport Hub V60 PRO - الإدارة الذكية للأسطول والنقل</p>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('trips', this)"><i class="fa-solid fa-route"></i> الرحلات</button>
        <button class="tab-btn" onclick="switchTab('treasury', this)"><i class="fa-solid fa-wallet"></i> الخزنة</button>
        <button class="tab-btn" onclick="switchTab('maintenance', this)"><i class="fa-solid fa-screwdriver-wrench"></i> الصيانة</button>
        <button class="tab-btn" onclick="switchTab('community', this)"><i class="fa-solid fa-users"></i> المجتمع</button>
    </div>

    <div class="container">
        
        <!-- قسم الرحلات -->
        <div id="trips" class="tab-content active">
            <div class="card">
                <h2><i class="fa-solid fa-plus-circle"></i> إضافة رحلة جديدة</h2>
                <div class="form-group">
                    <label>خط السير (من - إلى)</label>
                    <input type="text" id="tripRoute" class="form-control" placeholder="مثال: القاهرة - الإسكندرية">
                </div>
                <div class="form-group">
                    <label>قيمة الشحنة / الأجر</label>
                    <input type="number" id="tripCost" class="form-control" placeholder="المبلغ بالجنيه">
                </div>
                <div class="form-group">
                    <label>صورة بوليصة الشحن / المستند</label>
                    <input type="file" id="tripDoc" class="form-control" accept="image/*">
                </div>
                <button class="btn" onclick="addTrip()"><i class="fa-solid fa-save"></i> حفظ وتثبيت الرحلة</button>
            </div>

            <div class="card">
                <h2><i class="fa-solid fa-list"></i> سجل الرحلات النشطة</h2>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>خط السير</th>
                                <th>القيمة</th>
                                <th>الحالة</th>
                                <th>إجراء</th>
                            </tr>
                        </thead>
                        <tbody id="tripsTableBody">
                            <!-- يتم تعبئتها ديناميكياً -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- قسم الخزنة -->
        <div id="treasury" class="tab-content">
            <div class="card">
                <h2><i class="fa-solid fa-coins"></i> إدارة الحسابات والخزنة</h2>
                <div class="form-group">
                    <label>نوع الحركة</label>
                    <select id="transType" class="form-control">
                        <option value="in">إيراد (قبض)</option>
                        <option value="out">مصروف (سولار / صيانة / أخرى)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>المبلغ</label>
                    <input type="number" id="transAmount" class="form-control" placeholder="قيمة المبلغ">
                </div>
                <div class="form-group">
                    <label>البيان / الوصف</label>
                    <input type="text" id="transDesc" class="form-control" placeholder="تفاصيل الحركة المالية">
                </div>
                <button class="btn btn-accent" onclick="addTransaction()"><i class="fa-solid fa-plus"></i> تسجيل المعاملة</button>
            </div>
            
            <div class="card">
                <h2><i class="fa-solid fa-wallet"></i> الرصيد الصافي الحالي</h2>
                <h3 id="netBalance" style="text-align: center; color: var(--success); font-size: 1.8rem;">0 ج.م</h3>
            </div>
        </div>

        <!-- قسم الصيانة -->
        <div id="maintenance" class="tab-content">
            <div class="card">
                <h2><i class="fa-solid fa-oil-can"></i> تتبع صيانة السيارة والورشة</h2>
                <div class="form-group">
                    <label>نوع الصيانة / القطعة</label>
                    <input type="text" id="maintItem" class="form-control" placeholder="مثال: تغيير زيت، طقم دبرياج، سير دينامو">
                </div>
                <div class="form-group">
                    <label>التكلفة</label>
                    <input type="number" id="maintCost" class="form-control" placeholder="تكلفة الصيانة">
                </div>
                <button class="btn" onclick="addMaintenance()"><i class="fa-solid fa-check"></i> تسجيل صيانة</button>
            </div>
        </div>

        <!-- قسم المجتمع -->
        <div id="community" class="tab-content">
            <div class="card">
                <h2><i class="fa-solid fa-bullhorn"></i> لوحة إعلانات السائقين والمجتمع</h2>
                <div class="form-group">
                    <label>مشاركة خبرة أو تنبيه بالطريق</label>
                    <textarea id="postText" class="form-control" rows="3" placeholder="اكتب حالة الطريق، كمين، أو استفسار فني..."></textarea>
                </div>
                <button class="btn" onclick="addPost()"><i class="fa-solid fa-paper-plane"></i> نشر للمجتمع</button>
            </div>
            
            <div id="postsContainer">
                <!-- المنشورات -->
            </div>
        </div>

    </div>

    <script>
        // التبديل بين التبويبات
        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        // تخزين البيانات محلياً (Localstorage) لضمان العمل السلس على Acode والهاتف
        let trips = JSON.parse(localStorage.getItem('gt_trips')) || [];
        let transactions = JSON.parse(localStorage.getItem('gt_transactions')) || [];
        let posts = JSON.parse(localStorage.getItem('gt_posts')) || [];

        function saveAll() {
            localStorage.setItem('gt_trips', JSON.stringify(trips));
            localStorage.setItem('gt_transactions', JSON.stringify(transactions));
            localStorage.setItem('gt_posts', JSON.stringify(posts));
            renderData();
        }

        function addTrip() {
            let route = document.getElementById('tripRoute').value;
            let cost = document.getElementById('tripCost').value;
            if(!route || !cost) {
                alert('الرجاء إدخال خط السير والقيمة');
                return;
            }
            trips.push({route, cost, status: 'نشطة'});
            document.getElementById('tripRoute').value = '';
            document.getElementById('tripCost').value = '';
            saveAll();
            alert('تم حفظ الرحلة بنجاح!');
        }

        function addTransaction() {
            let type = document.getElementById('transType').value;
            let amount = parseFloat(document.getElementById('transAmount').value);
            let desc = document.getElementById('transDesc').value;
            if(!amount || !desc) {
                alert('الرجاء تعبئة بيانات المعاملة');
                return;
            }
            transactions.push({type, amount, desc});
            document.getElementById('transAmount').value = '';
            document.getElementById('transDesc').value = '';
            saveAll();
        }

        function addMaintenance() {
            let item = document.getElementById('maintItem').value;
            let cost = parseFloat(document.getElementById('maintCost').value);
            if(!item || !cost) return;
            transactions.push({type: 'out', amount: cost, desc: 'صيانة: ' + item});
            document.getElementById('maintItem').value = '';
            document.getElementById('maintCost').value = '';
            saveAll();
            alert('تم تسجيل المصروف وإضافته للخزنة');
        }

        function addPost() {
            let text = document.getElementById('postText').value;
            if(!text) return;
            posts.unshift({text, date: new Date().toLocaleDateString('ar-EG')});
            document.getElementById('postText').value = '';
            saveAll();
        }

        function renderData() {
            // جدول الرحلات
            let tBody = document.getElementById('tripsTableBody');
            tBody.innerHTML = '';
            trips.forEach((t, index) => {
                tBody.innerHTML += `<tr>
                    <td>${t.route}</td>
                    <td>${t.cost} ج.م</td>
                    <td><span class="badge badge-success">${t.status}</span></td>
                    <td><button class="btn" style="padding:4px 8px; font-size:0.75rem;" onclick="removeTrip(${index})">حذف</button></td>
                </tr>`;
            });

            // حساب الخزنة
            let balance = 0;
            transactions.forEach(tr => {
                if(tr.type === 'in') balance += tr.amount;
                else balance -= tr.amount;
            });
            document.getElementById('netBalance').innerText = balance + ' ج.م';

            // قسم المجتمع
            let pContainer = document.getElementById('postsContainer');
            pContainer.innerHTML = '';
            posts.forEach(p => {
                pContainer.innerHTML += `<div class="community-post">
                    <h4>سائق بالأسطول - <span style="font-size:0.75rem; color:#888;">${p.date}</span></h4>
                    <p>${p.text}</p>
                </div>`;
            });
        }

        function removeTrip(index) {
            trips.splice(index, 1);
            saveAll();
        }

        // تشغيل العرض عند التحميل الأول
        renderData();
    </script>
</body>
</html>
