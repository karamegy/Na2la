<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أسطورة الطريق - مجتمع السائقين واللوحة العامة (Community)</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --primary: linear-gradient(135deg, #1e293b, #0f172a);
            --accent: #2563eb;
            --accent-gradient: linear-gradient(135deg, #3b82f6, #1d4ed8);
            --success: #10b981;
            --success-gradient: linear-gradient(135deg, #34d399, #059669);
            --warning: #f59e0b;
            --danger: #ef4444;
            --danger-gradient: linear-gradient(135deg, #f87171, #dc2626);
            --purple: #8b5cf6;
            --purple-gradient: linear-gradient(135deg, #a78bfa, #7c3aed);
            --bg: #f1f5f9;
            --card-bg: linear-gradient(145deg, #ffffff, #f8fafc);
            --text-color: #1e293b;
            --border-color: #cbd5e1;
            --shadow-3d: 0 10px 25px -5px rgba(37, 99, 235, 0.15), 0 8px 10px -6px rgba(37, 99, 235, 0.1);
        }

        body.dark-mode {
            --bg: #090d16;
            --card-bg: linear-gradient(145deg, #1e293b, #0f172a);
            --text-color: #f8fafc;
            --border-color: #334155;
            --shadow-3d: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
        }

        body.theme-emerald { --accent: #059669; --accent-gradient: linear-gradient(135deg, #10b981, #047857); --primary: linear-gradient(135deg, #064e3b, #022c22); --bg: #ecfdf5; }
        body.theme-amber { --accent: #d97706; --accent-gradient: linear-gradient(135deg, #fbbf24, #b45309); --primary: linear-gradient(135deg, #78350f, #451a03); --bg: #fffbeb; }
        body.theme-purple { --accent: #7c3aed; --accent-gradient: linear-gradient(135deg, #a78bfa, #6d28d9); --primary: linear-gradient(135deg, #4c1d95, #2e1065); --bg: #f5f3ff; }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: var(--text-color); padding: 12px; padding-bottom: 90px; direction: rtl; transition: background 0.3s, color 0.3s; }
        
        .app-3d-logo-container { text-align: center; margin: 6px 0 12px 0; }
        .logo-3d {
            display: inline-block; 
            background: linear-gradient(135deg, var(--accent), #1e293b, #3b82f6);
            color: #ffffff; padding: 10px 20px; border-radius: 14px; font-size: 15px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 1.5px;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .logo-3d span { color: #38bdf8; }

        .theme-selector-bar { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; }
        .theme-btn { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }

        header { 
            background: var(--primary); 
            color: #fff; padding: 14px; border-radius: 12px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .card { 
            background: var(--card-bg); padding: 16px; border-radius: 12px; 
            box-shadow: var(--shadow-3d); margin-bottom: 12px; border: 1px solid var(--border-color); 
            position: relative; overflow: hidden;
        }
        .card::after {
            content: ""; position: absolute; top: 0; right: 0; width: 100%; height: 3px;
            background: var(--accent-gradient); opacity: 0.8;
        }
        .card h3 { margin-bottom: 10px; font-size: 14px; border-bottom: 2px solid var(--border-color); padding-bottom: 6px; color: var(--accent); }

        input, select, textarea, button { width: 100%; padding: 9px 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 11px; background: var(--card-bg); color: var(--text-color); margin-bottom: 8px; }
        
        .btn-main { background: var(--accent-gradient); color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-success { background: var(--success-gradient); color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-danger { background: var(--danger-gradient); color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-sm { padding: 5px 10px; font-size: 10px; width: auto; display: inline-block; margin: 2px; border-radius: 6px; }

        .load-post-media { 
            display: flex; gap: 12px; margin-top: 10px; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 8px; 
        }
        .load-post-media img, .load-post-media video { 
            width: 220px; height: 160px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border-color); cursor: pointer; flex-shrink: 0; 
        }
        
        .custom-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.9); z-index: 10000; justify-content: center; align-items: center; padding: 15px;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <div class="app-3d-logo-container">
        <div class="logo-3d">
            أسطورة الطريق <span>Community 3D Hub</span>
        </div>
    </div>

    <div class="theme-selector-bar">
        <div class="theme-btn" style="background: #2563eb;" onclick="setAppTheme('default')"></div>
        <div class="theme-btn" style="background: #059669;" onclick="setAppTheme('emerald')"></div>
        <div class="theme-btn" style="background: #d97706;" onclick="setAppTheme('amber')"></div>
        <div class="theme-btn" style="background: #7c3aed;" onclick="setAppTheme('purple')"></div>
    </div>

    <header>
        <div style="display: flex; align-items: center; gap: 10px;">
            <div id="header-avatar-container" style="width: 36px; height: 36px; border-radius: 50%; overflow: hidden; border: 2px solid #fff; background: #cbd5e1; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 12px;">صورة</div>
            <div>
                <h2 style="font-size: 13px;" id="header-username-title">مجتمع السائقين واللوحة العامة</h2>
                <small style="opacity: 0.85; font-size: 9px;" id="logged-user-label">جاري مزامنة الحساب...</small>
            </div>
        </div>
        <div style="display: flex; gap: 6px; align-items: center;">
            <a href="index.html" class="btn-sm" style="background: #0284c7; color: #fff; text-decoration: none;">🏠 الرئيسية</a>
            <button type="button" onclick="toggleDarkMode()" class="btn-sm" style="background:#475569; color:#fff;">🌙/☀️</button>
        </div>
    </header>

    <!-- صندوق النشر في المجتمع -->
    <div class="card" style="border: 2px solid var(--success);">
        <h3 style="color: var(--success);">✍️ شارك يومياتك أو حالة الطريق مع زملائك</h3>
        <input type="text" id="comm-author-name" readonly placeholder="اسم الكابتن..." style="margin-bottom: 6px; background: rgba(0,0,0,0.05); font-weight: bold;" title="مزامنة تلقائية من المنصة الأم">
        <textarea id="community-post-text" placeholder="بما تفكر يا كابتن؟ شارك حالة الطريق أو ملاحظات الرحلة..." style="height: 65px; resize: none;"></textarea>
        <div style="display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; align-items: center;">
            <label style="background: var(--bg); border: 1px solid var(--border-color); color: var(--text-color); padding: 5px 10px; border-radius: 6px; font-size: 10px; cursor: pointer; font-weight: bold;">
                📷 صور / فيديو <input type="file" id="community-media-file" accept="image/*,video/*" multiple hidden onchange="previewCommunityFiles(this)">
            </label>
            <button type="button" class="btn-success" onclick="publishCommunityPost()" style="margin-right: auto; width: auto; padding: 6px 16px;">نشر في المجتمع 🚀</button>
        </div>
        <div id="community-files-preview-info" style="font-size: 9px; color: var(--success); margin-top: 4px; font-weight: bold;"></div>
    </div>

    <!-- لوحة المنشورات والتفاعل -->
    <div class="card">
        <h3>📢 منشورات ورحلات الأسطول العامة</h3>
        <div id="community-posts-container"></div>
    </div>

    <!-- نافذة معاينة الوسائط -->
    <div id="mediaViewerModal" class="custom-modal" onclick="closeMediaViewer()">
        <div style="position: relative; max-width: 90%; max-height: 90vh; display: flex; justify-content: center; align-items: center;" onclick="event.stopPropagation()">
            <button type="button" onclick="closeMediaViewer()" class="btn-danger btn-sm" style="position: absolute; top: -35px; left: 0;">✕ إغلاق</button>
            <div id="mediaViewerContent" style="text-align: center;"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDn-rNJ2ak3I0DdfzTZmXKjePDdgxhfyIY",
            authDomain: "n2la-642d3.firebaseapp.com",
            projectId: "n2la-642d3",
            storageBucket: "n2la-642d3.firebasestorage.app",
            messagingSenderId: "1085749997466",
            appId: "1:1085749997466:web:13e5535dc6d2312397d423"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let communityFilesArr = [];
        let currentDriverProfile = {
            name: localStorage.getItem('logged_in_driver_name') || 'المدير',
            avatar: '',
            title: 'أسطورة الطريق'
        };

        async function syncProfileAndLoad() {
            try {
                const snapshot = await db.collection('drivers').get();
                snapshot.forEach(doc => {
                    let d = doc.data();
                    if (d.name === currentDriverProfile.name) {
                        if (d.avatar) currentDriverProfile.avatar = d.avatar;
                        if (d.title) currentDriverProfile.title = d.title;
                    }
                });
            } catch (e) {
                console.error("خطأ في مزامنة بيانات الكابتن:", e);
            }

            document.getElementById('comm-author-name').value = currentDriverProfile.name;
            document.getElementById('logged-user-label').innerText = `متصل كـ: ${currentDriverProfile.name} (${currentDriverProfile.title})`;
            
            const avatarContainer = document.getElementById('header-avatar-container');
            if (currentDriverProfile.avatar) {
                avatarContainer.innerHTML = `<img src="${currentDriverProfile.avatar}" style="width:100%; height:100%; object-fit:cover;">`;
            } else {
                avatarContainer.innerText = currentDriverProfile.name.charAt(0);
            }

            loadCommunityPosts();
        }

        function setAppTheme(themeName) {
            document.body.classList.remove('theme-emerald', 'theme-amber', 'theme-purple');
            if (themeName !== 'default') document.body.classList.add(`theme-${themeName}`);
            localStorage.setItem('app_theme', themeName);
        }
        if (localStorage.getItem('app_theme')) setAppTheme(localStorage.getItem('app_theme'));

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('dark_mode', document.body.classList.contains('dark-mode'));
        }
        if (localStorage.getItem('dark_mode') === 'true') document.body.classList.add('dark-mode');

        function compressImage(file, maxWidth = 1200, maxHeight = 1000, quality = 0.9, callback) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function (event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function () {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    if (width > height) {
                        if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }
                    } else {
                        if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; }
                    }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', quality));
                };
            };
        }

        function previewCommunityFiles(input) {
            communityFilesArr = [];
            const info = document.getElementById('community-files-preview-info');
            if (input.files && input.files.length > 0) {
                info.innerText = `جاري معالجة ${input.files.length} ملفات...`;
                let processed = 0;
                for (let i = 0; i < input.files.length; i++) {
                    let file = input.files[i];
                    if (file.type.startsWith('image')) {
                        compressImage(file, 1200, 1000, 0.9, (compressedUrl) => {
                            communityFilesArr.push({ name: file.name, type: 'image', src: compressedUrl });
                            processed++;
                            if (processed === input.files.length) info.innerText = `تم اختيار الملفات بنجاح ✅`;
                        });
                    } else if (file.type.startsWith('video')) {
                        let reader = new FileReader();
                        reader.onload = (e) => {
                            communityFilesArr.push({ name: file.name, type: 'video', src: e.target.result });
                            processed++;
                            if (processed === input.files.length) info.innerText = `تم اختيار الملفات بنجاح ✅`;
                        };
                        reader.readAsDataURL(file);
                    }
                }
            } else { info.innerText = ''; }
        }

        function publishCommunityPost() {
            const text = document.getElementById('community-post-text').value.trim();
            if (!text && communityFilesArr.length === 0) { alert('الرجاء كتابة نص أو إرفاق صور للنشر!'); return; }

            let newId = String(Date.now());
            let newPost = {
                id: newId,
                author: currentDriverProfile.name,
                authorAvatar: currentDriverProfile.avatar,
                authorTitle: currentDriverProfile.title,
                text: text,
                files: [...communityFilesArr],
                likes: 0,
                date: new Date().toLocaleString('ar-EG')
            };

            db.collection('communityPosts').doc(newId).set(newPost).then(() => {
                document.getElementById('community-post-text').value = '';
                communityFilesArr = [];
                document.getElementById('community-files-preview-info').innerText = '';
                alert('تم نشر التحديث في مجتمع السائقين بنجاح! 🚀');
            });
        }

        function loadCommunityPosts() {
            db.collection('communityPosts').onSnapshot(snapshot => {
                const container = document.getElementById('community-posts-container');
                container.innerHTML = '';
                let posts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                posts.sort((a, b) => Number(b.id) - Number(a.id));

                if (posts.length === 0) {
                    container.innerHTML = `<p style="font-size:10px; text-align:center; opacity:0.8;">لا توجد منشورات في المجتمع بعد. كن أول المشاركين!</p>`;
                    return;
                }

                posts.forEach(p => {
                    let mediaHtml = '';
                    if (p.files && p.files.length > 0) {
                        mediaHtml += `<div class="load-post-media">`;
                        p.files.forEach(f => {
                            if (f.type === 'video') mediaHtml += `<video src="${f.src}" onclick="viewMedia('${f.src}', 'video')"></video>`;
                            else mediaHtml += `<img src="${f.src}" onclick="viewMedia('${f.src}', 'image')"/>`;
                        });
                        mediaHtml += `</div>`;
                    }

                    let avatarHtml = p.authorAvatar ? `<img src="${p.authorAvatar}" style="width:32px; height:32px; border-radius:50%; object-fit:cover; border:1px solid var(--accent);">` : `<div style="width:32px; height:32px; border-radius:50%; background:var(--accent); color:#fff; display:flex; justify-content:center; align-items:center; font-size:11px; font-weight:bold;">${p.author ? p.author.charAt(0) : 'ع'}</div>`;

                    let card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                            <div style="display:flex; align-items:center; gap:8px;">
                                ${avatarHtml}
                                <div>
                                    <strong style="font-size:11px; color:var(--accent);">${p.author || 'سائق'}</strong>
                                    <span style="font-size:8px; display:block; opacity:0.7;">${p.authorTitle || 'سائق معتمد'}</span>
                                </div>
                            </div>
                            <span style="font-size:8px; opacity:0.7;">${p.date}</span>
                        </div>
                        <p style="font-size:11px; line-height:1.4;">${p.text}</p>
                        ${mediaHtml}
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px; border-top:1px solid var(--border-color); padding-top:6px;">
                            <button type="button" class="btn-sm" style="background:var(--bg); border:1px solid var(--border-color); color:var(--text-color);" onclick="likePost('${p.id}')">👍 إعجاب (${p.likes || 0})</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            });
        }

        function likePost(id) {
            db.collection('communityPosts').doc(String(id)).get().then(doc => {
                if(doc.exists) {
                    let data = doc.data();
                    let currentLikes = data.likes || 0;
                    db.collection('communityPosts').doc(String(id)).update({ likes: currentLikes + 1 });
                }
            });
        }

        function viewMedia(src, type) {
            const modal = document.getElementById('mediaViewerModal');
            const content = document.getElementById('mediaViewerContent');
            content.innerHTML = type === 'video' ? `<video controls autoplay src="${src}" style="max-width:100%; max-height:85vh; border-radius:8px;"></video>` : `<img src="${src}" style="max-width:100%; max-height:85vh; border-radius:8px; object-fit:contain;"/>`;
            modal.style.display = 'flex';
        }
        function closeMediaViewer() {
            document.getElementById('mediaViewerModal').style.display = 'none';
            document.getElementById('mediaViewerContent').innerHTML = '';
        }

        window.onload = syncProfileAndLoad;
    </script>
</body>
</html>
