<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجتمع نقلة (Na2la) - V52 PRO</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    
    <!-- توحيد مكتبات Firebase على الإصدار v8 لضمان التزامن الفوري بدون تعارض -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --accent-green: #22c55e;
            --border-color: #e2e8f0;
            --admin-bg: #0f172a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 90px; }

        .na2la-top-bar {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            padding: 12px 15px;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .na2la-brand-area { display: flex; align-items: center; gap: 10px; }
        .na2la-logo-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary-color); background: white; }
        .na2la-brand-title { font-size: 1.1rem; font-weight: bold; }

        /* شريط التنقل السفلي */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background-color: var(--card-bg); border-top: 1px solid var(--border-color);
            display: flex; justify-content: space-around; align-items: center;
            padding: 10px 5px; z-index: 1000; box-shadow: 0 -4px 15px rgba(0,0,0,0.05);
        }
        .bottom-nav-item {
            text-decoration: none; color: #94a3b8; font-size: 0.75rem; font-weight: bold;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            cursor: pointer; background: none; border: none; outline: none; flex: 1; transition: color 0.2s;
        }
        .bottom-nav-item span.icon { font-size: 1.4rem; }
        .bottom-nav-item.active, .bottom-nav-item:hover { color: var(--primary-color); }

        .container { max-width: 800px; margin: 15px auto; padding: 0 15px; }
        
        .section-title { font-size: 1rem; margin: 20px 0 12px 0; color: #334155; border-right: 4px solid var(--primary-color); padding-right: 8px; font-weight: bold; }

        .card { background: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--border-color); box-shadow: 0 2px 8px rgba(0,0,0,0.04); }

        .btn { background: var(--primary-color); color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; display: inline-block; font-size: 0.9rem; transition: background 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-success { background-color: var(--accent-green); }

        textarea, input[type="text"] { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.9rem; outline: none; background: #f8fafc; }

        /* تصميم المنشور مطابق للصورة 1000304367.jpg */
        .post-card { background: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 20px; border: 1px solid var(--border-color); box-shadow: 0 4px 10px rgba(0,0,0,0.03); display: flex; flex-direction: column; }
        .post-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .post-header-left { display: flex; gap: 10px; align-items: center; }
        .post-avatar { width: 45px; height: 45px; border-radius: 50%; background: var(--primary-color); color: white; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: bold; background-size: cover; background-position: center; border: 2px solid transparent; }
        .post-author-name { font-weight: bold; font-size: 1rem; color: var(--text-color); }
        .post-author-badge { font-size: 0.75rem; color: var(--primary-color); margin-top: 2px; }
        .post-time { font-size: 0.75rem; color: #94a3b8; direction: ltr; }
        
        .post-body { font-size: 0.95rem; line-height: 1.6; color: #1e293b; margin-bottom: 12px; white-space: pre-wrap; }
        .post-image { width: 100%; max-height: 350px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; border: 1px solid var(--border-color); }

        /* شريط التفاعلات مطابق للصورة */
        .post-actions-bar { display: flex; justify-content: space-around; border-top: 1px solid var(--border-color); padding-top: 12px; color: #475569; font-weight: bold; font-size: 0.9rem; }
        .post-action-btn { cursor: pointer; display: flex; align-items: center; gap: 6px; user-select: none; transition: color 0.2s; }
        .post-action-btn.liked { color: var(--primary-color); }
        .post-action-btn:hover { color: var(--primary-color); }

        .comments-section { margin-top: 15px; border-top: 1px dashed var(--border-color); padding-top: 10px; display: none; }
        .comment-item { background: #f1f5f9; padding: 8px 12px; border-radius: 8px; margin-bottom: 8px; font-size: 0.85rem; }
        .comment-input-group { display: flex; gap: 8px; margin-top: 10px; }

        /* لوحة تحكم المدير والتراكبات */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; display: none; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-content { background: var(--card-bg); width: 90%; max-width: 600px; border-radius: 16px; padding: 20px; max-height: 85vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 15px; font-weight: bold; color: var(--primary-color); }
    </style>
</head>
<body>

    <header class="na2la-top-bar">
        <div class="na2la-brand-area">
            <div id="headerLogoImg" class="na2la-logo-img" style="display:flex; justify-content:center; align-items:center; background:white; color:var(--primary-color); font-weight:bold;">ن</div>
            <span class="na2la-brand-title">أسطورة الطريق - المجتمع</span>
        </div>
        <div style="font-size: 0.75rem; opacity: 0.8;" id="connectionStatus">متصل 🟢</div>
    </header>

    <div class="container">
        <!-- حائط النشر -->
        <h2 class="section-title">✍️ شارك تحديث أو رحلة مع السائقين والعملاء</h2>
        <div class="card" style="border-right: 4px solid var(--primary-color);">
            <div style="font-size: 0.8rem; color: #64748b; margin-bottom: 10px;">النشر باسم: <strong style="color: var(--primary-color);" id="postingAsAccountName">جاري التحميل...</strong></div>
            
            <textarea id="groupPostText" placeholder="اكتب تحديثاً، حالة طريق، أو ملاحظة على بروفايلك..."></textarea>
            
            <div style="margin-top:10px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; border-top: 1px solid var(--border-color); padding-top: 12px;">
                <label style="cursor: pointer; background: #f1f5f9; border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: bold; color: #475569;">
                    📷 صورة/فيديو
                    <input type="file" id="groupPostImage" accept="image/*" style="display: none;">
                </label>
                <button class="btn btn-success" onclick="publishGroupPost()">نشر على الحائط 🚀</button>
            </div>
        </div>

        <!-- المنشورات -->
        <h2 class="section-title">📢 منشورات وحالات الأسطول</h2>
        <div id="groupFeedStream">
            <p style="text-align: center; color: #94a3b8; padding: 20px;">جاري المزامنة مع السحابة...</p>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <nav class="bottom-nav">
        <!-- تأكد من أن أسماء الملفات في مشروعك تطابق هذه الروابط لتجنب خطأ 404 -->
        <button class="bottom-nav-item" onclick="location.href='index.html'">
            <span class="icon">☰</span>
            <span>القائمة</span>
        </button>
        <button class="bottom-nav-item" onclick="location.href='safe.html'">
            <span class="icon">💰</span>
            <span>الخزنة</span>
        </button>
        <button class="bottom-nav-item active" onclick="location.href='community.html'">
            <span class="icon">💬</span>
            <span>المجتمع</span>
        </button>
        <button class="bottom-nav-item" onclick="location.href='cargo.html'">
            <span class="icon">📦</span>
            <span>الشحنات</span>
        </button>
        <button class="bottom-nav-item" onclick="location.href='profile.html'">
            <span class="icon">👤</span>
            <span>البروفايل</span>
        </button>
    </nav>

    <!-- أكواد جافاسكريبت و Firebase (نسخة v8 مستقرة) -->
    <script>
        // إعدادات قاعدة البيانات الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyDn-rNJ2ak3I0DdfzTZmXKjePDdgxhfyIY",
            authDomain: "n2la-642d3.firebaseapp.com",
            projectId: "n2la-642d3",
            storageBucket: "n2la-642d3.firebasestorage.app",
            messagingSenderId: "1085749997466",
            appId: "1:1085749997466:web:13e5535dc6d2312397d423"
        };
        
        // التهيئة الآمنة والفورية
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();

        // بيانات الحساب المتصل من التخزين المحلي (LocalStorage)
        let currentAccount = JSON.parse(localStorage.getItem('na2la_logged_user_haretg')) || {
            name: localStorage.getItem('logged_in_driver_name') || "سائق الأسطول",
            details: "حساب افتراضي",
            badge: "أسطورة الطريق",
            isAdmin: false,
            avatar: ""
        };

        // مصادقة مجهولة سريعة لفتح صلاحيات Firestore
        auth.signInAnonymously().then(() => {
            console.log("✅ متصل بقاعدة البيانات بنجاح");
            document.getElementById('connectionStatus').innerText = "متصل 🟢";
            document.getElementById('postingAsAccountName').innerText = currentAccount.name;
            
            // بدء جلب المنشورات بمجرد الاتصال
            initRealtimeFeed();
        }).catch((err) => {
            console.error("خطأ في الاتصال:", err);
            document.getElementById('connectionStatus').innerText = "غير متصل 🔴";
        });

        // دالة ضغط ورفع الصور
        function publishGroupPost() {
            const text = document.getElementById('groupPostText').value.trim();
            const fileInput = document.getElementById('groupPostImage');
            
            if (!text && fileInput.files.length === 0) {
                alert("يرجى كتابة تحديث أو إرفاق صورة أولاً.");
                return;
            }

            if (fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    savePostToCloud(text, e.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                savePostToCloud(text, "");
            }
        }

        // حفظ المنشور في السحابة بحيث يظهر باستقلالية
        function savePostToCloud(text, imgData) {
            const newPost = {
                author: currentAccount.name,
                badge: currentAccount.badge || 'سائق',
                avatar: currentAccount.avatar || '',
                text: text,
                image: imgData,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                timeString: new Date().toLocaleString('ar-EG', { dateStyle: 'short', timeStyle: 'short' }),
                likes: 0,
                likedBy: [],
                comments: []
            };

            db.collection("community_posts").add(newPost).then(() => {
                document.getElementById('groupPostText').value = "";
                document.getElementById('groupPostImage').value = "";
            }).catch(err => {
                alert("حدث خطأ أثناء النشر: " + err.message);
            });
        }

        // جلب المنشورات الحية مع الترتيب المحلي لمنع أخطاء (Index)
        function initRealtimeFeed() {
            const container = document.getElementById('groupFeedStream');
            
            db.collection("community_posts").onSnapshot((snapshot) => {
                let posts = [];
                snapshot.forEach(doc => {
                    let data = doc.data();
                    posts.push({ id: doc.id, ...data });
                });

                // ترتيب زمني محلي (الأحدث يظهر أولاً)
                posts.sort((a, b) => {
                    let timeA = a.timestamp ? a.timestamp.toMillis() : Date.now();
                    let timeB = b.timestamp ? b.timestamp.toMillis() : Date.now();
                    return timeB - timeA;
                });

                if (posts.length === 0) {
                    container.innerHTML = "<p style='text-align:center; color:#94a3b8; padding:20px;'>لا توجد منشورات حالياً. كن أول من ينشر!</p>";
                    return;
                }

                container.innerHTML = posts.map(p => {
                    let likedByMe = (p.likedBy || []).includes(currentAccount.name);
                    let commentsArray = p.comments || [];
                    
                    let commentsHtml = commentsArray.map(c => `
                        <div class="comment-item">
                            <strong style="color:var(--primary-color);">${c.author}:</strong> ${c.text}
                        </div>
                    `).join('');
                    
                    // تحويل مصفوفات الإعجاب والتعليقات لنصوص يمكن تمريرها في الدوال
                    let likedByJson = JSON.stringify(p.likedBy || []).replace(/"/g, '&quot;');
                    let commentsJson = JSON.stringify(p.comments || []).replace(/"/g, '&quot;');
                    
                    // ستايل صورة الكابتن
                    let avatarStyle = p.avatar ? `background-image: url('${p.avatar}');` : '';
                    let avatarInitial = p.avatar ? '' : (p.author ? p.author.charAt(0) : 'ع');

                    return `
                        <div class="post-card">
                            <div class="post-header">
                                <div class="post-header-left">
                                    <div class="post-avatar" style="${avatarStyle}">${avatarInitial}</div>
                                    <div>
                                        <div class="post-author-name">${p.author}</div>
                                        <div class="post-author-badge">${p.badge || 'سائق'}</div>
                                    </div>
                                </div>
                                <div class="post-time">${p.timeString || 'الآن'}</div>
                            </div>
                            
                            <div class="post-body">${p.text}</div>
                            ${p.image ? `<img src="${p.image}" class="post-image" onclick="viewImage('${p.image}')">` : ''}
                            
                            <!-- شريط التفاعلات المطابق للصورة -->
                            <div class="post-actions-bar">
                                <div class="post-action-btn ${likedByMe ? 'liked' : ''}" onclick="toggleLike('${p.id}', ${p.likes || 0}, ${likedByJson})">
                                    👍 إعجاب (${p.likes || 0})
                                </div>
                                <div class="post-action-btn" onclick="toggleComments('${p.id}')">
                                    💬 تعليق (${commentsArray.length})
                                </div>
                                <div class="post-action-btn" onclick="sharePost('${p.text}')">
                                    🔗 مشاركة
                                </div>
                            </div>

                            <!-- صندوق التعليقات -->
                            <div id="comments_${p.id}" class="comments-section">
                                <div style="max-height: 150px; overflow-y: auto; margin-bottom: 8px;">
                                    ${commentsHtml || '<div style="font-size:0.8rem; color:#94a3b8;">لا توجد تعليقات حتى الآن.</div>'}
                                </div>
                                <div class="comment-input-group">
                                    <input type="text" id="commentInput_${p.id}" placeholder="اكتب تعليقاً..." onkeypress="if(event.key === 'Enter') addComment('${p.id}', ${commentsJson})">
                                    <button class="btn btn-success" style="padding: 8px 15px;" onclick="addComment('${p.id}', ${commentsJson})">إرسال</button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }, (error) => {
                console.error("خطأ في جلب الحائط:", error);
            });
        }

        // دالة الإعجاب (تضيف/تزيل اسمك من القائمة سحابياً)
        function toggleLike(postId, currentLikes, likedByArray) {
            const postRef = db.collection("community_posts").doc(postId);
            let likedBy = Array.isArray(likedByArray) ? likedByArray : [];
            
            if (likedBy.includes(currentAccount.name)) {
                likedBy = likedBy.filter(n => n !== currentAccount.name);
                currentLikes = Math.max(0, currentLikes - 1);
            } else {
                likedBy.push(currentAccount.name);
                currentLikes += 1;
            }
            
            postRef.update({ likes: currentLikes, likedBy: likedBy });
        }

        // إظهار وإخفاء التعليقات
        function toggleComments(postId) {
            const el = document.getElementById(`comments_${postId}`);
            if (el) el.style.display = (el.style.display === 'block') ? 'none' : 'block';
        }

        // إضافة تعليق سحابياً
        function addComment(postId, existingCommentsArray) {
            const input = document.getElementById(`commentInput_${postId}`);
            const text = input.value.trim();
            if (!text) return;

            let comments = Array.isArray(existingCommentsArray) ? existingCommentsArray : [];
            comments.push({
                author: currentAccount.name,
                text: text,
                time: new Date().toLocaleTimeString('ar-EG')
            });

            db.collection("community_posts").doc(postId).update({ comments: comments }).then(() => {
                input.value = "";
            });
        }

        // دالة المشاركة
        function sharePost(text) {
            if (navigator.share) {
                navigator.share({ title: 'مجتمع نقلة', text: text }).catch(console.error);
            } else {
                navigator.clipboard.writeText(text);
                alert("تم نسخ النص للمشاركة! 🔗");
            }
        }
    </script>
</body>
</html>
