<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تواصل السائقين - V52 PRO</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .comm-container { max-width: 800px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2, h3 { color: #333; text-align: center; }
        .post-creator, .admin-login-box { background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ddd; }
        input, textarea { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn-main { background-color: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn-main:hover { background-color: #0056b3; }
        .post-card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: relative; }
        .post-author { font-weight: bold; color: #007bff; margin-bottom: 5px; }
        .post-text { color: #444; margin-bottom: 10px; white-space: pre-wrap; }
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; margin-top: 10px; border-radius: 5px; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .btn-delete { background-color: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; font-size: 12px; margin-top: 10px; }
        .admin-controls { margin-top: 15px; text-align: left; }
        .status-bar { padding: 10px; margin-bottom: 15px; border-radius: 5px; text-align: center; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="comm-container">
    <h2>منصة تواصل السائقين الموسعة (سحابية)</h2>

    <div id="connectionStatus" class="status-bar" style="background:#e9ecef;">☁️ جاري الاتصال بالسحابة...</div>

    <!-- تحكم المؤسس -->
    <div class="admin-login-box">
        <div id="adminStatus">وضع السائقين العاديين (النشر متاح للجميع)</div>
        <button id="adminToggleBtn" onclick="toggleAdminMode()" class="btn-main" style="background-color: #6c757d; margin-top: 8px;">دخول وضع المؤسس (للحذف)</button>
    </div>

    <!-- نموذج إضافة منشور -->
    <div class="post-creator">
        <h3>مشاركة جديدة (رسالة أو فيديو يوتيوب)</h3>
        <form id="driverPostForm" onsubmit="addNewPost(event)">
            <input type="text" id="authorName" placeholder="اسم السائق الثلاثي أو الثنائي" required>
            <textarea id="postContent" placeholder="اكتب تفاصيل التواصل، الخبر، أو الملاحظة..." rows="3" required></textarea>
            <input type="url" id="videoUrl" placeholder="رابط فيديو يوتيوب (اختياري)">
            <button type="submit" class="btn-main">نشر المحتوى سحابياً</button>
        </form>
    </div>

    <div id="postsContainer">
        <p style='text-align:center; color:#777;'>جاري تحميل المنشورات من السحابة...</p>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDn-rNJ2ak3I0DdfzTZmXKjePDdgxhfyIY",
        authDomain: "n2la-642d3.firebaseapp.com",
        projectId: "n2la-642d3",
        storageBucket: "n2la-642d3.firebasestorage.app",
        messagingSenderId: "1085749997466",
        appId: "1:1085749997466:web:13e5535dc6d2312397d423",
        measurementId: "G-KH4ZYFB8LC"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    window.db = db; // اجعلها متاحة عالمياً للسكربت الآخر

    signInAnonymously(auth).then(() => {
        document.getElementById("connectionStatus").innerText = "☁️ متصل سحابياً (آمن)";
        document.getElementById("connectionStatus").style.background = "#d4edda";
        loadPosts();
    }).catch(err => {
        document.getElementById("connectionStatus").innerText = "⚠️ خطأ في الاتصال بالسحابة";
        document.getElementById("connectionStatus").style.background = "#f8d7da";
    });
</script>

<script>
    let isAdmin = false;

    function toggleAdminMode() {
        if (!isAdmin) {
            let password = prompt("أدخل كلمة مرور المؤسس:");
            if (password === "admin123") {
                isAdmin = true;
                document.getElementById("adminStatus").innerText = "أنت الآن مسجل كـ [مؤسس النظام] - يمكنك حذف أي منشور.";
                document.getElementById("adminStatus").style.color = "green";
                document.getElementById("adminToggleBtn").innerText = "خروج من وضع المؤسس";
                document.getElementById("adminToggleBtn").style.backgroundColor = "#dc3545";
                loadPosts();
            } else {
                alert("كلمة المرور غير صحيحة!");
            }
        } else {
            isAdmin = false;
            document.getElementById("adminStatus").innerText = "وضع السائقين العاديين (النشر متاح للجميع)";
            document.getElementById("adminStatus").style.color = "#333";
            document.getElementById("adminToggleBtn").innerText = "دخول وضع المؤسس (للحذف)";
            document.getElementById("adminToggleBtn").style.backgroundColor = "#6c757d";
            loadPosts();
        }
    }

    function getYouTubeEmbedUrl(url) {
        if (!url) return null;
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? 'https://www.youtube.com/embed/' + match[2] : null;
    }

    async function loadPosts() {
        const container = document.getElementById("postsContainer");
        const { collection, onSnapshot, query, orderBy } = window.firebaseModules || { collection: () => {}, onSnapshot: () => {}, query: () => {}, orderBy: () => {} };
        
        // استخدام Firestore بدلاً من LocalStorage
        const q = query(collection(window.db, "driver_community_posts"), orderBy("timestamp", "desc"));
        
        onSnapshot(q, (snapshot) => {
            container.innerHTML = "";
            if (snapshot.empty) {
                container.innerHTML = "<p style='text-align:center; color:#777;'>لا توجد منشورات حالياً.</p>";
                return;
            }
            
            snapshot.forEach((docSnap) => {
                const post = docSnap.data();
                const postId = docSnap.id;
                
                let postDiv = document.createElement("div");
                postDiv.className = "post-card";
                
                let videoHtml = "";
                let embedUrl = getYouTubeEmbedUrl(post.videoUrl);
                if (embedUrl) {
                    videoHtml = `<div class="video-wrapper"><iframe src="${embedUrl}" allowfullscreen></iframe></div>`;
                }

                let deleteBtnHtml = isAdmin ? `<button class="btn-delete" onclick="deletePost('${postId}')">حذف (صلاحية المؤسس)</button>` : "";

                postDiv.innerHTML = `
                    <div class="post-author">${post.author} <span style="font-size: 11px; color: #888; font-weight: normal;">(${post.date})</span></div>
                    <div class="post-text">${post.content}</div>
                    ${videoHtml}
                    <div class="admin-controls">${deleteBtnHtml}</div>
                `;
                container.appendChild(postDiv);
            });
        });
    }

    async function addNewPost(event) {
        event.preventDefault();
        const { collection, addDoc } = window.firebaseModules;
        const author = document.getElementById("authorName").value;
        const content = document.getElementById("postContent").value;
        const videoUrl = document.getElementById("videoUrl").value;
        
        await addDoc(collection(window.db, "driver_community_posts"), {
            author, content, videoUrl,
            date: new Date().toLocaleString('ar-EG'),
            timestamp: new Date()
        });

        document.getElementById("driverPostForm").reset();
    }

    async function deletePost(postId) {
        if (!isAdmin) return;
        if (confirm("هل أنت متأكد من حذف هذا المنشور نهائياً؟")) {
            const { doc, deleteDoc } = window.firebaseModules;
            await deleteDoc(doc(window.db, "driver_community_posts", postId));
        }
    }
</script>

<!-- Import necessary modules for the logic script to use -->
<script type="module">
    import { collection, addDoc, onSnapshot, query, orderBy, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    window.firebaseModules = { collection, addDoc, onSnapshot, query, orderBy, doc, deleteDoc };
</script>

</body>
</html>
