<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تواصل السائقين الاحترافية - V53 PRO SECURE ISOLATED</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #007bff; --danger: #dc3545; --success: #28a745; --bg: #f4f6f9; --card-bg: #fff; }
        body { font-family: Tahoma, sans-serif; background-color: var(--bg); margin: 0; padding: 15px; color: #333; padding-bottom: 90px; }
        .comm-container { max-width: 850px; margin: 0 auto; background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2, h3 { text-align: center; color: #222; }
        .status-bar { padding: 10px; margin-bottom: 15px; border-radius: 6px; text-align: center; font-size: 0.9rem; background: #e9ecef; }
        .admin-box, .post-creator, .search-box { background: #fafbfc; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #e1e4e8; }
        input, textarea, select { width: 100%; padding: 10px; margin: 6px 0 12px 0; border: 1px solid #ccd0d5; border-radius: 6px; box-sizing: border-box; font-family: Tahoma; background: #fff; color: #333; }
        .btn { background-color: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-danger { background-color: var(--danger); }
        .btn-success { background-color: var(--success); width: auto; padding: 5px 12px; font-size: 0.85rem; }
        .btn-nav { background: #475569; color: #fff; text-decoration: none; padding: 6px 14px; border-radius: 6px; font-size: 0.85rem; display: inline-block; font-weight: bold; }
        .post-card { background: #fff; border: 1px solid #e1e4e8; border-radius: 8px; padding: 18px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); position: relative; }
        .post-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        .post-author { font-weight: bold; color: var(--primary); }
        .badge { background: #e2e8f0; color: #475569; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; }
        .badge-emergency { background: #fee2e2; color: #991b1b; }
        .badge-traffic { background: #fef3c7; color: #92400e; }
        .badge-route { background: #dbeafe; color: #1e40af; }
        .post-text { margin-bottom: 12px; white-space: pre-wrap; line-height: 1.6; }
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; margin-top: 10px; border-radius: 6px; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .post-actions { display: flex; gap: 10px; margin-top: 15px; align-items: center; }
        .comments-section { margin-top: 15px; border-top: 1px dashed #ddd; padding-top: 10px; background: #f8fafc; padding: 10px; border-radius: 6px; }
        .comment-item { font-size: 0.9rem; background: #fff; padding: 8px; border-radius: 4px; margin-bottom: 6px; border: 1px solid #eee; }
    </style>
</head>
<body>

<div class="comm-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 6px;">
        <a href="index.html" class="btn-nav">🏠 الرئيسية</a>
        <a href="operations-hub.html" class="btn-nav" style="background: #2563eb;">🚀 العمليات</a>
        <span id="company-badge-display" style="font-size: 0.8rem; background: #e2e8f0; padding: 4px 10px; border-radius: 6px; font-weight: bold;">الشركة: جاري التحميل...</span>
    </div>

    <h2>منصة تواصل السائقين والأسطول الاحترافية</h2>
    <div id="connectionStatus" class="status-bar">☁️ جاري الاتصال بقاعدة البيانات ومزامنة الحساب الآمن...</div>

    <!-- لوحة تحكم المؤسس والإدارة -->
    <div class="admin-box">
        <div id="adminStatus" style="font-size: 0.9rem; margin-bottom: 8px; font-weight: bold;">حالة الحساب: جاري التحقق من الصلاحيات...</div>
        <button id="adminToggleBtn" onclick="toggleAdminMode()" class="btn" style="background-color: #6c757d;">تفعيل وضع المؤسس (للإشراف)</button>
    </div>

    <!-- نموذج إضافة منشور -->
    <div class="post-creator">
        <h3>مشاركة جديدة أو تنبيه طريق لشراكة الشركة</h3>
        <form id="driverPostForm">
            <input type="text" id="authorName" placeholder="اسم السائق الثلاثي" required readonly style="background:#f1f5f9; cursor:not-allowed;">
            <select id="postCategory">
                <option value="عام">دردشة وعام</option>
                <option value="تنبيه مروري">تنبيه مروري / رادار</option>
                <option value="حالة الطرق">حالة الطرق والازدحام</option>
                <option value="مساعدة طارئة">مساعدة طارئة 🚨</option>
            </select>
            <textarea id="postContent" placeholder="اكتب تفاصيل الحالة أو الخبر هنا..." rows="3" required></textarea>
            <input type="url" id="videoUrl" placeholder="رابط فيديو يوتيوب (اختياري)">
            <button type="submit" class="btn">نشر المشاركة لشراكتك فوراً 🚀</button>
        </form>
    </div>

    <!-- شريط البحث والفلترة -->
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 ابحث في منشورات شراكتك أو أسماء الزملاء..." oninput="filterPosts()">
    </div>

    <!-- حاوية المنشورات -->
    <div id="postsContainer">
        <p style='text-align:center; color:#777;'>جاري تحميل المنشورات المعزولة للشراكة...</p>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, deleteDoc, updateDoc, increment, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDn-rNJ2ak3I0DdfzTZmXKjePDdgxhfyIY",
        authDomain: "n2la-642d3.firebaseapp.com",
        projectId: "n2la-642d3",
        storageBucket: "n2la-642d3.firebasestorage.app",
        messagingSenderId: "1085749997466",
        appId: "1:1085749997466:web:13e5535dc6d2312397d423"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // 🔄 مزامنة الحساب المتصل ومعرف الشراكة عبر الرابط والـ LocalStorage
    function getActiveSessionAndCompany() {
        const urlParams = new URLSearchParams(window.location.search);
        let externalId = urlParams.get('userId') || urlParams.get('id') || urlParams.get('phone') || urlParams.get('driver') || urlParams.get('name');
        
        if (externalId && externalId.trim() !== '' && externalId !== 'null') {
            externalId = externalId.trim();
            localStorage.setItem('logged_in_driver_name', externalId);
            localStorage.setItem('na2la_external_logged_user_id', externalId);
        }

        let activeName = localStorage.getItem('logged_in_driver_name') || localStorage.getItem('na2la_external_logged_user_id') || 'المدير';
        activeName = activeName.trim();

        let isSuper = ['Admin1', 'المدير', 'مدير', 'عماد', 'Emad', 'باندا'].includes(activeName);
        let compId = isSuper ? 'comp_1787481011714' : (localStorage.getItem('current_company_id') || ('comp_' + activeName.replace(/[^a-zA-Z0-9]/g, '_')));
        
        localStorage.setItem('current_company_id', compId);
        return { activeName, compId, isSuper };
    }

    let sessionData = getActiveSessionAndCompany();
    let activeSessionName = sessionData.activeName;
    let currentCompanyId = sessionData.compId;
    window.currentCompanyId = currentCompanyId;

    document.getElementById('authorName').value = activeSessionName;
    document.getElementById('company-badge-display').innerText = `🏢 الشراكة / الشركة: ${currentCompanyId}`;

    window.manualAdminOverride = false;

    function isSuperAdmin() {
        return window.manualAdminOverride || ['Admin1', 'المدير', 'مدير', 'عماد', 'Emad', 'باندا'].includes(activeSessionName);
    }
    window.isSuperAdmin = isSuperAdmin;

    let allPostsData = [];
    const postsRef = collection(db, "driver_community_posts");

    // الاعتماد على قواعد فايربيس ومراقبة حالة المصادقة الآمنة بدلاً من الدخول المجهول
    onAuthStateChanged(auth, (user) => {
        document.getElementById("connectionStatus").innerText = `✅ متصل سحابياً (مزامنة الحساب: ${activeSessionName} | شراكة: ${currentCompanyId})`;
        document.getElementById("connectionStatus").style.background = "#d4edda";
        updateAdminUIStatus();
        loadPosts();
        setupRealtimeDriversSync();
    });

    // مراقبة سحابية فورية لأي تحديث يخص الحساب أو الشراكة المتصلة
    function setupRealtimeDriversSync() {
        onSnapshot(collection(db, "drivers"), (snapshot) => {
            snapshot.docChanges().forEach(change => {
                let d = change.doc.data();
                if (d.name === activeSessionName || d.id === activeSessionName || d.phone === activeSessionName) {
                    if (d.companyId && d.companyId !== currentCompanyId) {
                        currentCompanyId = d.companyId;
                        window.currentCompanyId = currentCompanyId;
                        localStorage.setItem('current_company_id', currentCompanyId);
                        document.getElementById('company-badge-display').innerText = `🏢 الشراكة / الشركة: ${currentCompanyId}`;
                        loadPosts();
                    }
                }
            });
        });
    }

    function updateAdminUIStatus() {
        let superAdmin = isSuperAdmin();
        const statusEl = document.getElementById("adminStatus");
        const btnEl = document.getElementById("adminToggleBtn");
        
        if (superAdmin) {
            statusEl.innerText = `حالة الحساب: [مدير عام المنصة الأم - رؤية شاملة لكافة الشراكات والشركات]`;
            statusEl.style.color = "#28a745";
            btnEl.innerText = window.manualAdminOverride ? "إلغاء وضع المؤسس اليدوي" : "مسؤول عام معتمد 🛡️";
        } else {
            statusEl.innerText = `حالة الحساب: متصل بـ (${activeSessionName}) ضمن شراكة معزولة (${currentCompanyId})`;
            statusEl.style.color = "#333";
            btnEl.innerText = "تفعيل وضع المؤسس (للإشراف العام)";
        }
    }

    // جلب المنشورات والتعليقات مع عزل تام لشراكات الشركات
    function loadPosts() {
        const q = query(postsRef, orderBy("timestamp", "desc"));
        onSnapshot(q, async (snapshot) => {
            allPostsData = [];
            let superAdmin = isSuperAdmin();

            for (const docSnap of snapshot.docs) {
                const post = docSnap.data();
                const id = docSnap.id;
                
                if (!superAdmin && post.companyId && post.companyId !== currentCompanyId) {
                    continue;
                }

                const commentsSnap = await getDocs(collection(db, "driver_community_posts", id, "comments"));
                let comments = [];
                commentsSnap.forEach(c => {
                    let cData = c.data();
                    if (superAdmin || !cData.companyId || cData.companyId === currentCompanyId) {
                        comments.push({ id: c.id, ...cData });
                    }
                });

                allPostsData.push({ id, ...post, comments });
            }
            renderPosts(allPostsData);
        });
    }

    window.renderPosts = function(posts) {
        const container = document.getElementById("postsContainer");
        container.innerHTML = "";
        
        if (posts.length === 0) {
            container.innerHTML = "<p style='text-align:center; color:#777;'>لا توجد منشورات متاحة لشراكتك حالياً.</p>";
            return;
        }

        let superAdmin = isSuperAdmin();

        posts.forEach((post) => {
            const embed = getYouTubeEmbedUrl(post.videoUrl);
            let badgeClass = "badge";
            if (post.category === "مساعدة طارئة") badgeClass += " badge-emergency";
            else if (post.category === "تنبيه مروري") badgeClass += " badge-traffic";
            else if (post.category === "حالة الطرق") badgeClass += " badge-route";

            let commentsHtml = "";
            post.comments.forEach(comm => {
                commentsHtml += `<div class="comment-item"><strong>${comm.author}:</strong> ${comm.text}</div>`;
            });

            container.innerHTML += `
                <div class="post-card">
                    <div class="post-meta">
                        <div>
                            <span class="post-author">${post.author}</span>
                            <span class="${badgeClass}" style="margin-right: 8px;">${post.category || 'عام'}</span>
                            ${post.companyId ? `<span style="font-size:9px; background:#f1f5f9; padding:2px 6px; border-radius:4px; margin-right:6px;">شراكة: ${post.companyId}</span>` : ''}
                        </div>
                        <span style="font-size: 11px; color: #888;">${post.date || ''}</span>
                    </div>
                    <div class="post-text">${post.content}</div>
                    ${embed ? `<div class="video-wrapper"><iframe src="${embed}"></iframe></div>` : ""}
                    
                    <div class="post-actions">
                        <button class="btn btn-success" onclick="likePost('${post.id}')">👍 أعجبني (${post.likes || 0})</button>
                        ${superAdmin || post.author === activeSessionName ? `<button class="btn btn-danger" style="width:auto; padding:5px 12px; font-size:0.85rem;" onclick="deletePost('${post.id}')">حذف المنشور 🗑️</button>` : ""}
                    </div>

                    <div class="comments-section">
                        <div style="font-size: 0.85rem; font-weight: bold; margin-bottom: 5px;">التعليقات:</div>
                        <div id="comments-${post.id}">${commentsHtml || '<div style="font-size:0.8rem; color:#888;">لا توجد تعليقات بعد.</div>'}</div>
                        <form onsubmit="addComment(event, '${post.id}')" style="margin-top: 8px; display: flex; gap: 5px; flex-wrap: wrap;">
                            <input type="text" placeholder="اسمك..." id="commAuthor-${post.id}" value="${activeSessionName}" readonly required style="margin:0; width: 30%; background:#f1f5f9;">
                            <input type="text" placeholder="اكتب تعليقاً..." id="commText-${post.id}" required style="margin:0; width: 52%;">
                            <button type="submit" class="btn" style="width: 15%; padding: 5px; font-size: 0.8rem;">رد</button>
                        </form>
                    </div>
                </div>`;
        });
    }

    document.getElementById("driverPostForm").onsubmit = async (e) => {
        e.preventDefault();
        await addDoc(postsRef, {
            author: activeSessionName,
            category: document.getElementById("postCategory").value,
            content: document.getElementById("postContent").value,
            videoUrl: document.getElementById("videoUrl").value,
            companyId: currentCompanyId,
            likes: 0,
            date: new Date().toLocaleString('ar-EG', { dateStyle: 'short', timeStyle: 'short' }),
            timestamp: new Date()
        });
        document.getElementById("postContent").value = "";
        document.getElementById("videoUrl").value = "";
    };

    window.likePost = async (id) => {
        const postRef = doc(db, "driver_community_posts", id);
        await updateDoc(postRef, { likes: increment(1) });
    };

    window.addComment = async (e, postId) => {
        e.preventDefault();
        const text = document.getElementById(`commText-${postId}`).value;
        
        await addDoc(collection(db, "driver_community_posts", postId, "comments"), {
            author: activeSessionName, 
            text, 
            companyId: currentCompanyId, 
            timestamp: new Date()
        });
        document.getElementById(`commText-${postId}`).value = "";
    };

    window.deletePost = async (id) => {
        if (confirm("هل أنت متأكد من حذف هذا المنشور نهائياً؟")) {
            await deleteDoc(doc(db, "driver_community_posts", id));
        }
    };

    window.toggleAdminMode = function() {
        if (!window.manualAdminOverride && !['Admin1', 'المدير', 'مدير', 'عماد', 'Emad', 'باندا'].includes(activeSessionName)) {
            let pass = prompt("أدخل كلمة مرور المؤسس:");
            if (pass === "admin123") {
                window.manualAdminOverride = true;
                updateAdminUIStatus();
                loadPosts();
            } else {
                alert("كلمة المرور غير صحيحة!");
            }
        } else {
            window.manualAdminOverride = false;
            updateAdminUIStatus();
            loadPosts();
        }
    };

    window.filterPosts = function() {
        const keyword = document.getElementById("searchInput").value.toLowerCase();
        const filtered = allPostsData.filter(p => 
            p.content.toLowerCase().includes(keyword) || 
            p.author.toLowerCase().includes(keyword) ||
            p.category.toLowerCase().includes(keyword)
        );
        renderPosts(filtered);
    };

    function getYouTubeEmbedUrl(url) {
        if (!url) return null;
        const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=))([^"&?\/\s]{11})/);
        return match ? 'https://www.youtube.com/embed/' + match[1] : null;
    }
</script>
</body>
</html>
